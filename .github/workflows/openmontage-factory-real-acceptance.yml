name: OpenMontage Factory Real Acceptance
on:
  pull_request:
    paths:
      - "tests/test_openmontage_factory_acceptance.py"
      - ".github/workflows/openmontage-factory-real-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: FFmpeg
        run: ffmpeg -version && ffprobe -version
      - name: Real renderer to factory media storage
        run: python -m unittest -v tests.test_openmontage_factory_acceptance
