name: TEST – Publish Provenance Memory
on:
  pull_request:
    paths:
      - "memory_engine.py"
      - "tests/test_publish_provenance_memory.py"
      - ".github/workflows/test-publish-provenance-memory.yml"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and regression
        run: |
          python -m py_compile memory_engine.py tests/test_publish_provenance_memory.py
          PYTHONPATH=. python -u tests/test_publish_provenance_memory.py
