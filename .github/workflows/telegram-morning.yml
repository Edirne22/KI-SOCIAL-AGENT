name: Telegram Morning Approval

on:
  schedule:
    - cron: "15 6 * * *" # 08:15 Uhr in Deutschland während der Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-approval-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Send Telegram approval request
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_morning.py

      - name: Commit Telegram session only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/TELEGRAM_SESSION.md 2>/dev/null || true
          git commit -m "Auto: Telegram-Freigabe-Sitzung" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
