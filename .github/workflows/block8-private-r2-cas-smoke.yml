name: Block 8 actual private R2 conditional IfMatch write smoke
on:
  pull_request:
    paths:
      - 'scripts/block8_private_r2_cas_smoke.py'
      - 'tests/test_content_factory_r2_cas_live_smoke.py'
      - '.github/workflows/block8-private-r2-cas-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/block8-private-r2-cas-smoke.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax, in-memory CAS race and canonical job regression
        run: |
          python -m py_compile scripts/block8_private_r2_cas_smoke.py
          python -m unittest -v tests.test_content_factory_r2_cas_live_smoke tests.test_content_factory_r2_job_repository tests.test_content_factory_dashboard_review_ack
  real-private-r2:
    if: github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BLOCK8_PRIVATE_R2_CAS_SMOKE_APPROVED: 'true'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate existing private R2 credentials without disclosing values
        shell: bash
        run: |
          set -euo pipefail
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!key:-}" || { echo "Missing existing private R2 binding ${key}"; exit 1; }
          done
      - name: Install existing private R2 SDK
        run: python -m pip install --disable-pip-version-check boto3
      - name: Real isolated private R2 IfMatch CAS race and cleanup, no user review and no post
        run: python -m scripts.block8_private_r2_cas_smoke
