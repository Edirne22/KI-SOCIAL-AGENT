name: OpenMontage Research Media Metadata
on:
  pull_request:
    paths:
      - "openmontage_research.py"
      - "tests/test_openmontage_research_media_metadata.py"
      - ".github/workflows/openmontage-research-metadata.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_research_media_metadata
