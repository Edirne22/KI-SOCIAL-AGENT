name: KI Central single zero-price R2 → Runner → R2 acceptance test
on:
  push:
    branches: [feat/ai-central-e2e-controlled-runner]
    paths: [".github/workflows/ai-central-free-e2e-once.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ai-central-free-e2e-single
  cancel-in-progress: false
jobs:
  real-free-model-r2-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AI_CENTRAL_FREE_TIER_VERIFIED: "true"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check requests boto3
      - name: Verify requisite existing secrets, no key values emitted
        run: |
          for n in OPENROUTER_API_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!n}" || { echo "MISSING_SECRET_NAME: $n"; exit 2; }
          done
      - name: Write exactly one synthetic, non-sensitive user-reviewed R2 inbox draft
        run: |
          python - <<'PY'
          import boto3,datetime,json,os
          now=datetime.datetime.now(datetime.timezone.utc)
          task_id="ci-free-"+os.environ["GITHUB_RUN_ID"]
          date=now.strftime("%Y-%m-%d")
          key=f"ai-central/v1/inbox/{date}/{task_id}.json"
          task={"schema":"AI-INBOX-V1","id":task_id,"created_at":now.isoformat(),
            "channel":"web","kind":"message",
            "message":"Suggest one verifiable and non-destructive way to distinguish server readiness from a gateway response in an HTTP worker test.",
            "status":"QUEUED_FREE_REVIEW","auto_dispatch":False}
          client=boto3.client("s3",endpoint_url="https://"+os.environ["R2_ACCOUNT_ID"]+".r2.cloudflarestorage.com",
            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          client.put_object(Bucket=os.environ["R2_BUCKET_NAME"],Key=key,Body=json.dumps(task).encode(),ContentType="application/json")
          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write(f"INBOX_ID={task_id}\nINBOX_DATE={date}\nINBOX_KEY={key}\n")
          print("SYNTHETIC_R2_INBOX_QUEUED",task_id)
          PY
      - name: Read exact same synthetic draft with production review adapter
        run: python -m scripts.ai_central_reviewed_inbox_dispatch --date "$INBOX_DATE" --id "$INBOX_ID"
      - name: Invoke only audited $0 openrouter/free model; archive report to private R2
        run: python scripts/cloud_ai_central.py --task-file reviewed-central-task.json --inbox-task-id "$INBOX_ID" --free-only
      - name: Read back actual report and verify strict free-model provenance
        run: |
          python - <<'PY'
          import boto3,json,os
          c=boto3.client("s3",endpoint_url="https://"+os.environ["R2_ACCOUNT_ID"]+".r2.cloudflarestorage.com",
             aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          key=f'ai-central/v1/tasks/{os.environ["INBOX_ID"]}/runs/{os.environ["GITHUB_RUN_ID"]}/report.json'
          obj=c.get_object(Bucket=os.environ["R2_BUCKET_NAME"],Key=key)
          report=json.loads(obj["Body"].read(100000))
          assert report["schema"]=="CLOUD-AI-CENTRAL-V1" and report["task_id"]==os.environ["INBOX_ID"]
          assert report["status"]=="PENDING_REVIEW" and report["requires_human_approval"] is True
          assert len(report["results"])==2
          providers=[(a["provider"],a["model"],a.get("reported_model",""),a["status"])
             for role in report["results"] for a in role["attempts"]]
          assert providers and all(p[0]=="openrouter" and p[1]=="openrouter/free" for p in providers)
          assert any(p[3]=="ANSWER" for p in providers)
          print("REAL_FREE_MODEL_R2_E2E_PASS",json.dumps({"task_id":report["task_id"],
             "report_key":key,"roles":[r["role"]+":"+r["status"] for r in report["results"]],
             "provider_models":providers}))
          PY
      - name: Cleanup synthetic inbox item; preserve versioned private E2E report for audit
        if: always()
        run: |
          if test -n "${INBOX_KEY:-}" && test -n "$R2_BUCKET_NAME"; then
            python - <<'PY'
          import os,boto3
          c=boto3.client("s3",endpoint_url="https://"+os.environ["R2_ACCOUNT_ID"]+".r2.cloudflarestorage.com",
            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          c.delete_object(Bucket=os.environ["R2_BUCKET_NAME"],Key=os.environ["INBOX_KEY"])
          print("SYNTHETIC_INBOX_REMOVED")
          PY
          fi
