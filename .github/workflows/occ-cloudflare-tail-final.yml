name: OpenChatCut Edge Versus Container Isolation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENCHATCUT_MCP_TOKEN: ${{ secrets.OPENCHATCUT_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm install --no-save --ignore-scripts wrangler@4.107.0
      - name: Separate Worker health from container MCP with live tail
        shell: bash
        run: |
          set -uo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$OPENCHATCUT_MCP_TOKEN"
          (
            timeout --signal=TERM --kill-after=3s 90s npx wrangler tail edirne22-openchatcut-poc --format json 2>/tmp/occ-tail-err |
            python -u scripts/occ_cf_tail_filter.py > /tmp/occ-tail-safe
          ) &
          p=$!
          sleep 10
          base=https://edirne22-openchatcut-poc.butupeli.workers.dev
          h=$(curl -sS --max-time 9 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPENCHATCUT_MCP_TOKEN" "$base/_factory/health" || true)
          echo "CF_WORKER_HEALTH HTTP=$h"
          url=$base/api/external-mcp/mcp
          for i in 1; do
            body=$(mktemp)
            code=$(curl -sS --max-time 14 -o "$body" -w '%{http_code}' -X POST "$url" \
              -H "Authorization: Bearer $OPENCHATCUT_MCP_TOKEN" \
              -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"cf-tail-bounded","version":"1"}}}' || true)
            if grep -q '"protocolVersion"' "$body"; then valid=yes; else valid=no; fi
            echo "CF_BOUNDED_PROBE $i HTTP=$code protocolVersion=$valid"
            rm -f "$body"
            sleep 6
          done
          wait "$p" || true
          test -f /tmp/occ-tail-safe && cat /tmp/occ-tail-safe
          if grep -Eqi 'unauthorized|permission|authentication|forbidden|denied' /tmp/occ-tail-err; then
            echo "CF_TAIL_PERMISSION_REJECTED"
          fi
          echo "CF_TAIL_FINISHED"
          if test -s /tmp/occ-tail-err; then
            grep -Ei 'connected|created|error|failed|unauthorized|permission' /tmp/occ-tail-err | sed -E 's/([A-Za-z0-9_-]{32,})/[REDACTED]/g' | tail -n 3 || true
          fi
