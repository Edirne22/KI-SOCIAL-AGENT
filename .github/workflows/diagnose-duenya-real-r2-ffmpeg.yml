name: Diagnose Dunia actual R2 media FFmpeg (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-frame-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing read-only R2 dependency
        run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Verify FFmpeg availability and extract actual private media frames
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          from scripts.ai_central_shared_inbox import client_from_env, PREFIX
          from scripts.start_duenya_level12_exact import TASK_ID
          from scripts.private_birthday_first_production import recent_assets
          client,bucket=client_from_env()
          # Use the identical R2 session resolver as the production runtime.
          # The original task is only the prompt, not the media manifest.
          assets=recent_assets(client,bucket)
          print("DIAG_MEDIA_MANIFEST_COUNT="+str(len(assets)))
          if not assets: raise RuntimeError("DIAG_NO_MEDIA_ASSETS_IN_PRIVATE_UPLOAD_SESSION")
          for binary in ("ffprobe","ffmpeg"):
              result=subprocess.run([binary,"-version"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=10)
              if result.returncode: raise RuntimeError("DIAG_BINARY_UNAVAILABLE_"+binary.upper())
          failures=0
          for idx,asset in enumerate(assets):
              kind="VIDEO" if asset["mime"].startswith("video/") else "IMAGE"
              try:
                  with tempfile.TemporaryDirectory() as tmp:
                      source=Path(tmp)/("source.mp4" if kind=="VIDEO" else "source.png")
                      body=client.get_object(Bucket=bucket,Key=asset["key"])["Body"].read(100*1024*1024+1)
                      if len(body)>100*1024*1024: raise RuntimeError("SIZE_LIMIT")
                      source.write_bytes(body)
                      stamps=[0.0]
                      if kind=="VIDEO":
                          p=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(source)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=20)
                          if p.returncode: raise RuntimeError("FFPROBE_NONZERO")
                          duration=float(json.loads(p.stdout)["format"]["duration"])
                          stamps=[duration*x for x in (0.15,0.50,0.85)]
                      for n,stamp in enumerate(stamps):
                          frame=Path(tmp)/("frame-"+str(n)+".jpg")
                          ok=False
                          for seek in ([stamp,0.0] if kind=="VIDEO" else [stamp]):
                              p=subprocess.run(["ffmpeg","-v","error","-y","-ss",str(seek),"-i",str(source),"-map","0:v:0","-an","-sn","-dn","-frames:v","1","-vf","scale=512:-2","-threads","1",str(frame)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=40)
                              if p.returncode==0 and frame.exists() and frame.stat().st_size>2 and frame.read_bytes()[:3]==bytes.fromhex("ffd8ff"):
                                  ok=True;break
                              reason="SIGNAL" if p.returncode<0 else ("EXIT_NONZERO" if p.returncode else "INVALID_JPEG")
                          if not ok: raise RuntimeError("FRAME_"+reason)
                  print("DIAG_ASSET_"+str(idx)+"="+kind+"_PASS")
              except subprocess.TimeoutExpired:
                  failures+=1;print("DIAG_ASSET_"+str(idx)+"="+kind+"_TIMEOUT")
              except Exception as exc:
                  failures+=1
                  code=str(exc)
                  if code not in ("SIZE_LIMIT","FFPROBE_NONZERO","FRAME_SIGNAL","FRAME_EXIT_NONZERO","FRAME_INVALID_JPEG"):
                      code="UNCLASSIFIED"
                  print("DIAG_ASSET_"+str(idx)+"="+kind+"_"+code)
          print("DIAG_TESTED="+str(len(assets))+" FAILURES="+str(failures))
          if failures: raise RuntimeError("DIAG_REAL_FFMPEG_FAILURES_"+str(failures))
          PY
