name: Diagnose Dunia actual R2 media FFmpeg (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-frame-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing read-only R2 dependency
        run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Install FFmpeg and FFprobe on GitHub runner
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify FFmpeg availability and extract actual private media frames
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          from scripts.ai_central_shared_inbox import client_from_env, PREFIX
          from scripts.start_duenya_level12_exact import TASK_ID
          from scripts.private_birthday_first_production import recent_assets
          client,bucket=client_from_env()
          # Use the identical R2 session resolver as the production runtime.
          # The original task is only the prompt, not the media manifest.
          assets=recent_assets(client,bucket)
          print("DIAG_MEDIA_MANIFEST_COUNT="+str(len(assets)))
          if not assets: raise RuntimeError("DIAG_NO_MEDIA_ASSETS_IN_PRIVATE_UPLOAD_SESSION")
          for binary in ("ffprobe","ffmpeg"):
              result=subprocess.run([binary,"-version"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=10)
              if result.returncode: raise RuntimeError("DIAG_BINARY_UNAVAILABLE_"+binary.upper())
          # Focused read-only test: actual runner versions and two original R2 JPEGs.
          for binary in ("ffmpeg","ffprobe"):
              version=subprocess.run([binary,"-version"],capture_output=True,text=True,timeout=10,check=True)
              print("DIAG_VERSION_"+binary.upper()+"="+version.stdout.splitlines()[0])
          tested=0
          for idx,asset in enumerate(assets):
              if not asset["mime"].startswith("image/"): continue
              if tested>=2: break
              tested+=1
              with tempfile.TemporaryDirectory() as tmp:
                  source=Path(tmp)/"original.jpg"
                  raw=client.get_object(Bucket=bucket,Key=asset["key"])["Body"].read(100*1024*1024+1)
                  if len(raw)>100*1024*1024: raise RuntimeError("DIAG_SAMPLE_SIZE_LIMIT")
                  source.write_bytes(raw)
                  probe=subprocess.run(["ffprobe","-v","error","-select_streams","v:0","-show_entries","stream=codec_name,width,height","-of","json",str(source)],capture_output=True,text=True,timeout=20)
                  streams=json.loads(probe.stdout).get("streams",[]) if probe.returncode==0 else []
                  details=streams[0] if streams else {}
                  print("DIAG_SAMPLE_"+str(tested)+"_PROBE="+json.dumps({"status":"OK" if details else "FAILED","codec":details.get("codec_name","UNKNOWN"),"width":details.get("width",0),"height":details.get("height",0)}))
                  variants=[
                      ("simple",["ffmpeg","-v","error","-y","-i",str(source),"-frames:v","1","-f","image2"]),
                      ("scaled",["ffmpeg","-v","error","-y","-i",str(source),"-frames:v","1","-vf","scale=512:-2","-f","image2"]),
                      ("current",["ffmpeg","-v","error","-y","-ss","0","-i",str(source),"-map","0:v:0","-an","-sn","-dn","-frames:v","1","-vf","scale=512:-2","-threads","1","-update","1"])
                  ]
                  for name,args in variants:
                      dest=Path(tmp)/(name+".jpg")
                      result=subprocess.run(args+[str(dest)],capture_output=True,text=True,timeout=40)
                      valid=dest.exists() and dest.stat().st_size>2 and dest.read_bytes().startswith(bytes.fromhex("ffd8ff"))
                      # Error categories only: never print FFmpeg stderr or private media paths.
                      print("DIAG_SAMPLE_"+str(tested)+"_"+name.upper()+"="+("PASS" if valid else ("EXIT_NONZERO" if result.returncode else "NO_FRAME")))
          if tested!=2: raise RuntimeError("DIAG_NEED_TWO_JPEG_SAMPLES")
          print("DIAG_TWO_JPEG_SAMPLES_COMPLETE")
          PY
