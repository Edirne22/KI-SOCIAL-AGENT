name: Qwen secret presence
on:
  push:
    branches: [test/qwen-credential-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      QWEN_ACCESS_TOKEN: ${{ secrets.QWEN_ACCESS_TOKEN }}
    steps:
      - name: Check presence without printing credentials
        run: |
          if [[ -n "$QWEN_API_KEY" || -n "$DASHSCOPE_API_KEY" || -n "$QWEN_ACCESS_TOKEN" ]]; then
            echo 'QWEN_SECRET_PRESENT=true'
          else
            echo 'QWEN_SECRET_PRESENT=false'
            exit 1
          fi
