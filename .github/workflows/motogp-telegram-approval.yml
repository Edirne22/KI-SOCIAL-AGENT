name: MotoGP Telegram Approval
on:
  schedule:
    - cron: "*/5 6-21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: published-plan-writers
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: MotoGP Telegram-Freigabe verarbeiten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u motogp_telegram_receive.py
      - name: Freigabe an Publisher-Plan übergeben
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md memory/MOTOGP_APPROVAL_STATE.md 2>/dev/null || true
          git commit -m "Auto: MotoGP Telegram-Freigabe" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
