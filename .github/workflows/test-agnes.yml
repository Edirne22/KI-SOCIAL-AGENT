name: Test Agnes AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Run Agnes test
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python test_agnes.py
      - name: Test-Ergebnisse als Artifact sichern
        uses: actions/upload-artifact@v4
        with:
          name: agnes-test-output
          path: assets/test/
          if-no-files-found: warn
