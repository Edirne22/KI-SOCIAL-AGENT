name: OpenMontage Private Request Store
on:
  pull_request:
    paths:
      - "integrations/openmontage/private_request_store.py"
      - "tests/test_openmontage_private_request_store.py"
      - ".github/workflows/openmontage-private-request-store.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v tests.test_openmontage_private_request_store
