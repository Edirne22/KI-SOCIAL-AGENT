name: OpenChatCut Historic Cloudflare Logs Diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/openchatcut-observability-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historic-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Query historical Cloudflare observability logs (read only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) throw Error("Existing Cloudflare credentials absent");
          const endpoint="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/observability/telemetry/query";
          const windows=[["deploy","2026-10-01T10:16:00Z","2026-10-01T10:21:00Z"],["isolated","2026-10-01T10:43:45Z","2026-10-01T10:45:00Z"]];
          for (const [name,from,to] of windows) {
            const body={queryId:"edirne22-openchatcut-historic-diag",timeframe:{from:Date.parse(from),to:Date.parse(to)},view:"events",limit:200,parameters:{datasets:[],filters:[{key:"$metadata.service",operation:"eq",type:"string",value:"edirne22-openchatcut-poc"}]},dry:true};
            const result=await fetch(endpoint,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});
            const payload=await result.json().catch(()=>({}));
            if(!result.ok||payload.success===false) {
              console.log(JSON.stringify({window:name,http:result.status,errors:(payload.errors||[]).map(e=>({code:e.code,message:String(e.message||"").slice(0,150)}))}));
              continue;
            }
            const events=payload.result?.events?.events||[];
            console.log(JSON.stringify({window:name,http:result.status,total:payload.result?.events?.count??null,returned:events.length}));
            const interesting=/openchatcut_container_(start|stop|error)|not listening|suddenly disconnected|readiness_(ready|wait)|MCP session/i;
            for(const e of events) {
              const meta=e.$metadata||{}, raw=String(meta.message||e.message||"");
              if(!interesting.test(raw))continue;
              let parsed;try{parsed=JSON.parse(raw)}catch{parsed={event:"matched",message:raw.slice(0,180)}}
              console.log("LIFECYCLE",JSON.stringify({window:name,time:meta.timestamp||meta.startTime||e.timestamp||null,event:parsed.event||"matched",exitCode:parsed.exitCode??null,reason:parsed.reason??null,message:String(parsed.message||"").slice(0,180)}));
            }
          }
          NODE
