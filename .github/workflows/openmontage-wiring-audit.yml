name: OpenMontage Wiring Audit
on:
  pull_request:
    paths:
      - ".github/workflows/openmontage.yml"
      - "tests/test_openmontage_wiring_audit.py"
      - ".github/workflows/openmontage-wiring-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_wiring_audit
