name: OpenMontage Integration Tests
on:
  pull_request:
    paths:
      - 'integrations/openmontage/**'
      - 'scripts/openmontage_control.py'
      - 'scripts/openmontage_review.py'
      - 'tests/test_openmontage_review.py'
      - 'scripts/openmontage_quality_gate.py'
      - 'tests/test_openmontage_quality_gate.py'
      - 'tests/test_openmontage_private_preview_e2e.py'
      - 'scripts/openmontage_publish_preview.py'
      - 'scripts/openmontage_r2.py'
      - 'media_storage.py'
      - 'tests/test_openmontage_r2.py'
      - 'scripts/openmontage_telegram_preview.py'
      - 'scripts/openmontage_send_private_preview.py'
      - 'scripts/openmontage_renew_link.py'
      - 'tests/test_openmontage_telegram_preview.py'
      - 'telegram_router.py'
      - 'tests/test_openmontage.py'
      - 'test_telegram_router.py'
      - '.github/workflows/openmontage*.yml'
      - 'docs/OPENMONTAGE_FAQ.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .test-venv
          .test-venv/bin/pip install --no-cache-dir requests pyyaml Pillow beautifulsoup4 boto3
      - run: |
          .test-venv/bin/python -m unittest discover -s tests -p test_openmontage.py -v
          .test-venv/bin/python -m unittest discover -s tests -p test_openmontage_r2.py -v
          .test-venv/bin/python -m unittest discover -s tests -p test_openmontage_telegram_preview.py -v
          .test-venv/bin/python -m unittest discover -s tests -p test_openmontage_review.py -v
          .test-venv/bin/python -m unittest discover -s tests -p test_openmontage_quality_gate.py -v
          .test-venv/bin/python -m unittest discover -s tests -p test_openmontage_private_preview_e2e.py -v
          .test-venv/bin/python -m unittest test_telegram_router -v
          .test-venv/bin/python -m unittest discover -s tests -p test_telegram_schedule_recovery.py -v

  synthetic-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate synthetic test clip
        run: |
          mkdir -p /tmp/om-e2e
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=blue:s=640x360:r=30" -t 2 -c:v libx264 -pix_fmt yuv420p /tmp/om-e2e/source.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/om-e2e/job.json').write_text(json.dumps({'clips':[{'path':'source.mp4','seconds':2}]}))
          PY

  creative-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/openmontage-creative.yml
