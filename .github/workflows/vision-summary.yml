name: Vision Summary

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  vision-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Guard start date
        run: |
          if [ $(date +%s) -lt $(date -d '2026-10-18' +%s) ]; then
            echo 'Summary-Agent startet erst am 18.10.2026.'
            exit 0
          fi

      - name: Generate vision summary
        run: python agents/vision_summary_agent.py

      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/VISION_SUMMARY.md memory/VISION_LOG.jsonl
          git commit -m "chore: vision summary update [skip ci]" || echo "nichts zu committen"

      - name: Push changes
        run: git push
