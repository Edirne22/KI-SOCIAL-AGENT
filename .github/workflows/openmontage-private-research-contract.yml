name: OpenMontage Private Research Contract
on:
  pull_request:
    paths:
      - "scripts/openmontage_private_plan.py"
      - "tests/test_openmontage_private_research_contract.py"
      - ".github/workflows/openmontage-private-research-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_private_research_contract
