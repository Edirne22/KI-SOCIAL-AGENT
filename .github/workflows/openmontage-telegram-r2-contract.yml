name: OpenMontage Telegram R2 Contract
on:
  pull_request:
    paths:
      - "scripts/openmontage_telegram_r2_contract.py"
      - "tests/test_openmontage_telegram_r2_contract.py"
      - ".github/workflows/openmontage-telegram-r2-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_telegram_r2_contract
