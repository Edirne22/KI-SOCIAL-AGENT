name: Guarded Development Agent - Agent 21 Gate
on:
  pull_request:
    paths:
      - '.github/workflows/guarded-development-agent.yml'
      - 'agents/21_instandhaltungsagent.md'
      - 'agents/AGENTS_INDEX.md'
      - 'scripts/guarded_development_agent.py'
      - 'scripts/agent21_trusted_writer.py'
      - 'tests/test_guarded_development_agent.py'
      - 'Claude-Instandhaltung/**'
      - 'infra/ai-central-dashboard/**'
      - 'infra/private-asr/**'
      - 'infra/private-asr-cloudflare/**'
      - 'infra/ai-central-tools/claude-only/**'
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Explicit reviewed GitHub issue number"
        required: true
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: guarded-dev-agent21-${{ github.event.pull_request.number || inputs.issue_number || github.ref }}
  cancel-in-progress: false
jobs:
  verify-agent21-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify repository guardrails exist
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ("MASTER-SNAPSHOT.md","PROJECT_GUARDRAILS.md"):
              if not Path(path).is_file() or not Path(path).read_text().strip():
                  raise SystemExit("Missing mandatory guardrail: "+path)
          print("MANDATORY_GUARDRAILS_PRESENT")
          PY
      - name: Test planner and Agent 21 write boundaries
        run: python -m unittest discover -s tests -p 'test_guarded_development_agent.py' -v
      - name: Test Agent 21 read-only runtime diagnostics
        run: python -m unittest tests.test_agent21_runtime_diagnostics -v
      - name: Verify protected files remain outside Agent 21 write allowlist
        run: |
          python - <<'PY'
          from scripts.guarded_development_agent import _safe_path
          forbidden=[
            "PROJECT_GUARDRAILS.md",
            "MASTER-SNAPSHOT.md",
            "CLAUDE.md",
            "agents/11_system_restart_agent.md",
            ".github/workflows/guarded-development-agent.yml",
            "scripts/../PROJECT_GUARDRAILS.md",
          ]
          assert all(not _safe_path(p) for p in forbidden)
          print("AGENT21_PROTECTED_PATH_ATTACK_PASS")
          PY
      - name: Positive control bounded repair contract
        run: |
          python - <<'PY'
          from scripts.guarded_development_agent import AGENT21_ID, validate_agent21_write_contract
          c={
            "schema":"AGENT21-REPAIR-PATCH-V1",
            "agent":AGENT21_ID,
            "branch":"repair/agent21-positive-control",
            "machine":"synthetic-test-machine",
            "stage":"repair-contract",
            "changes":[{"path":"tests/agent21_positive_control.txt","content":"safe\n"}],
            "tests":["python -m unittest tests.test_guarded_development_agent -v"],
          }
          r=validate_agent21_write_contract(c)
          assert r["status"]=="WRITE_CONTRACT_VALIDATED"
          print("AGENT21_WRITE_CONTRACT_POSITIVE_CONTROL_PASS")
          PY
      - name: Agent 21 trusted writer end-to-end proof
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from scripts.guarded_development_agent import AGENT21_ID
          from scripts.agent21_trusted_writer import apply_changes, run_tests, write_repair_log
          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              contract={
                "schema":"AGENT21-REPAIR-PATCH-V1",
                "agent":AGENT21_ID,
                "branch":"repair/agent21-ci-e2e",
                "machine":"synthetic-test-machine",
                "stage":"trusted-writer-e2e",
                "changes":[
                  {"path":"scripts/repaired_component.py","content":"VALUE = 21\n"},
                  {"path":"tests/test_synthetic_repair.py","content":"import unittest\nfrom scripts.repaired_component import VALUE\nclass Proof(unittest.TestCase):\n    def test_repair(self): self.assertEqual(VALUE,21)\n"}
                ],
                "tests":["python -m unittest tests.test_synthetic_repair -v"],
              }
              (root/"scripts").mkdir(); (root/"scripts/__init__.py").write_text("")
              (root/"tests").mkdir(); (root/"tests/__init__.py").write_text("")
              patched=apply_changes(root,contract)
              tested=run_tests(root,patched["authorization"])
              repair={"repair_id":"A21-CI-E2E-001","date":"2026-10-05","machine":"synthetic-test-machine","stage":"trusted-writer-e2e","root_cause":"synthetic component required controlled repair","evidence":"validated patch plus shell-false targeted unittest","end_state":"VERIFIED"}
              logged=write_repair_log(root,repair)
              assert patched["status"]=="PATCHED"
              assert tested["status"]=="TESTED"
              assert logged["status"]=="REPAIR_LOGGED"
              assert (root/logged["path"]).is_file()
              print("AGENT21_E2E_VERIFIED")
          PY
      - name: Verify existing private media regression suite
        run: |
          python -m pip install --disable-pip-version-check requests boto3
          python -m unittest discover -s tests -p 'test_r2_media_warehouse.py' -v
          if test -f scripts/telegram_private_media.py; then
            python -m unittest discover -s tests -p 'test_telegram_private_media.py' -v
          else
            echo 'BLOCKED_MISSING_SOURCE: private Telegram intake remains on separate unmerged branch'
          fi
