name: Test Translation Router
on:
  pull_request:
    paths:
      - 'translation_router.py'
      - 'turkish_editor_qm.py'
      - 'test_translation_router.py'
      - 'tests/test_language_response_contract.py'
      - '.github/workflows/test-translation-router.yml'
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run translation_router smoke test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -c "
          from translation_router import TranslationRouter
          r = TranslationRouter()

          # Test DE -> TR
          result_de_tr = r.translate('Hallo, wie geht es dir?', 'de', 'tr')
          print('DE->TR:', result_de_tr)
          assert isinstance(result_de_tr, str) and len(result_de_tr) > 0

          # Test TR -> DE
          result_tr_de = r.translate('Merhaba, nasilsin?', 'tr', 'de')
          print('TR->DE:', result_tr_de)
          assert isinstance(result_tr_de, str) and len(result_tr_de) > 0

          print('OK')
          "

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow beautifulsoup4 pytest
      - name: Translation and editorial failure contracts
        run: python -m pytest -q test_translation_router.py tests/test_language_response_contract.py
      - name: Existing German and source-series controls
        run: PYTHONPATH=. python tests/test_turkish_series_language_hardening.py
