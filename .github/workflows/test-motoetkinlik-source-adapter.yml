name: TEST – MotoEtkinlik Source Adapter
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'motoetkinlik_source.py'
      - 'turkish_riders_scout.py'
      - 'turkish_editor_qm.py'
      - 'tests/test_turkish_t1_qm_regression.py'
      - 'tests/test_motoetkinlik_source_adapter.py'
      - '.github/workflows/test-motoetkinlik-source-adapter.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests Pillow beautifulsoup4
      - run: python -m py_compile motoetkinlik_source.py turkish_riders_scout.py turkish_editor_qm.py tests/test_motoetkinlik_source_adapter.py tests/test_turkish_t1_qm_regression.py
      - run: PYTHONPATH=. python tests/test_motoetkinlik_source_adapter.py
      - run: PYTHONPATH=. python tests/test_turkish_t1_qm_regression.py
