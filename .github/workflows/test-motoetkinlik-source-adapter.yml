name: TEST – MotoEtkinlik Source Adapter
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'motoetkinlik_source.py'
      - 'turkish_riders_scout_adapter.py'
      - 'motogp_content_agency_v2.py'
      - 'tests/test_motoetkinlik_source_adapter.py'
      - '.github/workflows/test-motoetkinlik-source-adapter.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python -m py_compile motoetkinlik_source.py turkish_riders_scout_adapter.py motogp_content_agency_v2.py tests/test_motoetkinlik_source_adapter.py
      - run: python tests/test_motoetkinlik_source_adapter.py
