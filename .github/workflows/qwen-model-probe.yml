name: Qwen Code existing-provider model probe
on:
  push:
    branches: [test/qwen-credential-probe]
    paths: [.github/workflows/qwen-model-probe.yml]
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qwen Code
        run: npm install --no-audit --no-fund -g @qwen-code/qwen-code
      - name: Check existing OpenRouter free model through Qwen Code
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          export OPENAI_API_KEY="$OPENROUTER_API_KEY"
          export OPENAI_BASE_URL="https://openrouter.ai/api/v1"
          export OPENAI_MODEL="openrouter/free"
          mkdir -p ~/.qwen
          printf '%s\n' '{"security":{"auth":{"selectedType":"openai"}},"model":{"name":"openrouter/free"}}' > ~/.qwen/settings.json
          timeout 75 qwen --prompt 'Reply with exactly QWEN_READY and nothing else. Do not use tools.' --approval-mode plan > /tmp/qwen-probe.log 2>&1 || { sed -E 's/sk-[A-Za-z0-9_-]+/[REDACTED]/g' /tmp/qwen-probe.log | tail -c 600; exit 1; }
          grep -q QWEN_READY /tmp/qwen-probe.log
          echo 'QWEN_CODE_OPENROUTER_HEADLESS=PASS'
