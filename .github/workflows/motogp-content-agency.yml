name: MotoGP Content Agency
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: motogp-content-agency
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Research → Voice → Domain-QM → Media → Chief-QM → Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python -u motogp_content_agency_v2.py
      - name: Memory, QM-Audit, Medien und Session persistent speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Alle von der Agency erzeugten/geänderten Racing-Artefakte erfassen.
          git add -A -- memory/ content/MOTOGP_ROSTER_NEXT.md assets/images/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Agency-Änderungen zu speichern"
          else
            git commit -m "Auto: MotoGP Paket nach Chief-QM"
          fi
          # Vor Rebase darf kein unversionierter Agency-Output übrig bleiben.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "FEHLER: Arbeitsbaum nach Persistenz nicht sauber"
            git status --short
            exit 1
          fi
          git pull --rebase origin main
          git push
