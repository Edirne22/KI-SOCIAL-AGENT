name: MotoGP Content Agency
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      force_new_run:
        description: "V8.5: duplicate protection bewusst umgehen (nur fuer gezielten Test)"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: motogp-content-agency
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Reruns of an older Actions run must execute against the current production branch.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests Pillow beautifulsoup4
      - name: Preflight – V8.5 Orchestrator + komplette Racing-Kette
        run: |
          python -m py_compile racing_v85.py racing_flush_notifications.py racing_v855_hardening.py racing_run_controller.py racing_v85_selftest.py motogp_content_agency_v2.py motogp_content_agency.py racing_pipeline_selftest.py racing_semantic_qm.py turkish_riders_scout.py motogp_quality_manager.py chief_quality_manager.py motogp_telegram_receive.py motogp_telegram_receive_v85.py llm_client.py router.py telegram_bot.py memory_engine.py generate_agnes_media.py asset_paths.py media_policy.py
          python racing_final_guard_selftest.py
          python tests/test_source_fact_contract_v1.py
          python racing_pipeline_selftest.py
          python racing_v85_selftest.py
          python - <<'PY'
          from turkish_riders_scout import scout, racing_scout
          from router import get_task_config, get_provider_for_task
          from llm_client import global_professional_context
          from racing_v855_hardening import install
          import motogp_content_agency_v2 as hardened
          import motogp_telegram_receive_v85 as approval
          install(hardened)
          # V8.5.5 regression: lower-class facts override generic MotoGP metadata and stay frozen.
          q={'title':'Quiles takes Moto3 pole at Misano','summary':'Moto3 qualifying','series':'MotoGP','source_series':'MotoGP'}
          hardened.lock_source_series(q)
          if q.get('trusted_series')!='Moto3' or hardened.series_for(q)!='Moto3': raise SystemExit('V8.5.5 immutable series lock failed')
          q['series']='MotoGP'; hardened.lock_source_series(q)
          if q.get('series')!='Moto3': raise SystemExit('V8.5.5 series lock did not survive mutation/feedback')
          a=scout(1); b=racing_scout(1)
          if a and len(a[0]) != 3: raise SystemExit(f"Turkish scout contract invalid: {len(a[0])}")
          if b and len(b[0]) != 4: raise SystemExit(f"Racing scout contract invalid: {len(b[0])}")
          expected={'final_captions':'agnes','racing_semantic_qm':'agnes'}
          for task,provider in expected.items():
              cfg=get_task_config(task)
              if cfg.get('response_type') != 'text': raise SystemExit(f'{task} response_type invalid')
              if get_provider_for_task(task) != provider: raise SystemExit(f'{task} provider invalid')
          if approval.MIN_SESSION_VERSION != 18: raise SystemExit('V8.5 approval session minimum invalid')
          ctx=global_professional_context()
          if 'PROFESSIONAL AGENT STANDARD' not in ctx or 'HUMAN WRITING PROTOCOL' not in ctx: raise SystemExit('global professional context missing')
          print('V8.5.5 preflight: immutable series + source-fact whitelist + technical QM retry: PASS')
          PY
      - name: V8.5 Run Controller → Research → Redaktion → QM → Media → Human Approval Gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # workflow_dispatch boolean is also present as a string in github.event.inputs.
          # Resolve from the event payload explicitly so a checked box cannot be lost.
          INPUT_FORCE_NEW_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_new_run == 'true' && 'true' || 'false' }}
        run: |
          echo "force_new_run resolved=${INPUT_FORCE_NEW_RUN}"
          python -u racing_v85.py
      - name: V8.5 State, Memory, QM-Audit, Medien und Session persistent speichern
        if: always()
        run: bash scripts/persist_racing_state.sh
      - name: Telegram-Freigabe erst nach erfolgreicher Persistenz senden
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python racing_flush_notifications.py
