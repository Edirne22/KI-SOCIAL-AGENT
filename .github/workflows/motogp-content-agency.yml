name: MotoGP Content Agency
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: motogp-content-agency
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: pip install requests
      - name: Preflight Python contracts
        run: |
          python -m py_compile motogp_content_agency_v2.py turkish_riders_scout.py motogp_quality_manager.py chief_quality_manager.py motogp_telegram_receive.py llm_client.py router.py
          python - <<'PY'
          from turkish_riders_scout import scout, racing_scout
          from router import get_task_config
          a=scout(1)
          b=racing_scout(1)
          if a and len(a[0]) != 3:
              raise SystemExit(f"Turkish scout contract invalid: {len(a[0])}")
          if b and len(b[0]) != 4:
              raise SystemExit(f"Racing scout contract invalid: {len(b[0])}")
          task=get_task_config('final_captions')
          if task.get('response_type') != 'text':
              raise SystemExit('final_captions route invalid')
          print("Preflight contracts + DE editor route: PASS")
          PY
      - name: Research → DE-Redakteur → Voice → Domain-QM → Media → Chief-QM → Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u motogp_content_agency_v2.py
      - name: Memory, QM-Audit, Medien und Session persistent speichern
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- memory/ assets/images/
          if [ -f content/MOTOGP_ROSTER_NEXT.md ]; then
            git add -- content/MOTOGP_ROSTER_NEXT.md
          fi
          if git diff --cached --quiet; then
            echo "Keine Agency-Änderungen zu speichern"
          else
            git commit -m "Auto: Racing Agency Audit und Chief-QM"
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "FEHLER: Arbeitsbaum nach Persistenz nicht sauber"
            git status --short
            exit 1
          fi
          git pull --rebase origin main
          git push
