name: OpenMontage Single Run Production
on:
  pull_request:
    paths:
      - ".github/workflows/openmontage.yml"
      - "tests/test_openmontage_single_run_production.py"
      - ".github/workflows/openmontage-single-run.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python -m unittest -v tests.test_openmontage_single_run_production
