name: TEST – Racing Retry Root Cause
on:
  pull_request:
    paths:
      - "llm_client.py"
      - "llm_router.py"
      - "test_llm_client_racing_fallback.py"
      - "tests/test_provider_response_recovery.py"
      - "racing_semantic_qm.py"
      - "racing_event_contract.py"
      - "racing_source_claim_guard.py"
      - "chief_quality_manager.py"
      - "racing_final_guard.py"
      - "motogp_quality_manager.py"
      - "racing_v855_hardening.py"
      - "motogp_content_agency_v2.py"
      - "config/model_router.json"
      - "tests/test_racing_retry_root_cause.py"
      - "tests/test_racing_event_session_contract.py"
      - "tests/test_racing_source_claim_strength.py"
      - "tests/test_german_writing_editor_gate.py"
      - ".github/workflows/test-racing-retry-root-cause.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests Pillow beautifulsoup4 pytest
      - name: Provider recovery and model-lock regression (offline)
        run: |
          python -m pytest -q tests/test_provider_response_recovery.py test_llm_client_racing_fallback.py tests/test_ai_central_claude_legacy_router.py
          PYTHONPATH=. python tests/test_source_fact_contract_v1.py
          PYTHONPATH=. python tests/test_weekly_plan_community_contract.py
      - run: python -m py_compile llm_client.py racing_event_contract.py racing_source_claim_guard.py racing_semantic_qm.py racing_final_guard.py motogp_quality_manager.py racing_v855_hardening.py motogp_content_agency_v2.py tests/test_racing_retry_root_cause.py tests/test_racing_event_session_contract.py tests/test_racing_source_claim_strength.py tests/test_german_writing_editor_gate.py
      - run: PYTHONPATH=. python tests/test_racing_retry_root_cause.py
      - run: PYTHONPATH=. python tests/test_racing_event_session_contract.py
      - run: PYTHONPATH=. python tests/test_racing_source_claim_strength.py
      - run: PYTHONPATH=. python tests/test_german_writing_editor_gate.py
