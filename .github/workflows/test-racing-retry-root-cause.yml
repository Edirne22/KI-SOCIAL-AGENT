name: TEST – Racing Retry Root Cause
on:
  pull_request:
    paths:
      - "llm_client.py"
      - "racing_semantic_qm.py"
      - "racing_v855_hardening.py"
      - "motogp_content_agency_v2.py"
      - "config/model_router.json"
      - "tests/test_racing_retry_root_cause.py"
      - "tests/test_racing_gate_parity_diagnostic.py"
      - ".github/workflows/test-racing-retry-root-cause.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests Pillow beautifulsoup4
      - run: python -m py_compile llm_client.py racing_semantic_qm.py racing_v855_hardening.py motogp_content_agency_v2.py tests/test_racing_retry_root_cause.py tests/test_racing_gate_parity_diagnostic.py
      - run: PYTHONPATH=. python tests/test_racing_retry_root_cause.py
      - run: PYTHONPATH=. python tests/test_racing_gate_parity_diagnostic.py
