name: Block 9 dashboard live browser E2E gate
on:
  pull_request:
    paths:
      - '.github/workflows/block9-dashboard-live-e2e.yml'
      - '.github/workflows/ai-central-dashboard-deploy.yml'
      - 'infra/ai-central-dashboard/tests/live-dashboard-e2e.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-dashboard-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AI_DASHBOARD_TOKEN: ${{ secrets.AI_DASHBOARD_TOKEN }}
      PRIVATE_ASR_INTERNAL_TOKEN: ${{ secrets.PRIVATE_ASR_INTERNAL_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      REQUIRE_DASHBOARD_RESEARCH: "false"
      REQUIRE_CURRENT_DATE_TRUTH: "true"
      DASHBOARD_URL: https://edirne22-ai-central-dashboard.butupeli.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate protected browser-test credential
        run: test "${#AI_DASHBOARD_TOKEN}" -ge 24 || { echo "AI_DASHBOARD_TOKEN unavailable"; exit 1; }
      - name: Install browser harness
        working-directory: infra/ai-central-dashboard
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real production dashboard browser E2E
        working-directory: infra/ai-central-dashboard
        run: node tests/live-dashboard-e2e.mjs
      - name: Live branch Groq browser-search gateway proof
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY unavailable"; exit 1; }
          python3 -m pip install --quiet requests
          PYTHONPATH=infra/private-asr python3 - <<'PY'
          import os
          import research_gateway as rg
          out=rg._groq_browser_search("What is the current date? Return current public web sources.",os.environ["GROQ_API_KEY"])
          assert out.get("live_search") is True, str(out.get("warning"))
          assert out.get("provider")=="Groq-BrowserSearch"
          rows=out.get("results") or []
          assert rows and all(str(x.get("url","")).startswith(("https://","http://")) for x in rows)
          print("BRANCH_GROQ_BROWSER_SEARCH_SOURCE_PROOF_OK")
          PY
      - name: Agent 21 direct research diagnostic after E2E failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_ASR_INTERNAL_TOKEN" || { echo "DIRECT_RESEARCH_DIAG token=missing"; exit 1; }
          url="https://edirne22-private-asr.butupeli.workers.dev/research/search"
          payload='{"query":"What is the current date? Return current public web sources."}'
          code=$(curl -sS -o /tmp/direct-research -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" -H 'Content-Type: application/json' \
            --data "$payload" "$url" || true)
          python3 - "$code" <<'PY'
          import json,re,sys,subprocess
          code=sys.argv[1]
          provider="unknown"; warning=f"DIRECT_RESEARCH_HTTP_{code}"; source_count=0; live=False
          if code=="200":
              try:
                  d=json.load(open("/tmp/direct-research"))
                  provider=str(d.get("provider") or "unknown")[:80]
                  warning=str(d.get("warning") or "none")[:120]
                  source_count=len(d.get("results") or [])
                  live=d.get("live_search") is True
              except Exception:
                  warning="DIRECT_RESEARCH_NON_JSON"
          safe_warning=re.sub(r"[^A-Za-z0-9 _.,:;()/\'-]"," ",warning)
          safe_warning=re.sub(r"\\s+"," ",safe_warning).strip()[:120] or "unknown"
          print(f"DIRECT_RESEARCH_DIAG live={str(live).lower()} provider={provider} sources={source_count} warning={safe_warning}")
          payload={"run_id":"${{ github.run_id }}","commit":"${{ github.sha }}","machine":"private-asr-container",
                   "route":"/research/search","provider":provider,"state":"success" if live else "failure",
                   "error_class":safe_warning,"container_health":"not_rechecked","opencode_health":"dashboard_chat_passed"}
          p=subprocess.run(["python3","scripts/agent21_runtime_diagnostics.py"],input=json.dumps(payload),text=True,capture_output=True,check=True)
          print(p.stdout.strip())
          PY
