name: Telegram Receive Approval

on:
  schedule:
    - cron: "*/5 6-21 * * *" # alle 5 Minuten, 08:00–23:00 deutsche Sommerzeit
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: published-plan-writers
  cancel-in-progress: false
jobs:
  receive-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Read Telegram approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python telegram_receive.py

      - name: Commit Telegram results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md 2>/dev/null || true
          git add memory/SEARCH_PROVIDER_LOG.md 2>/dev/null || true
          git add memory/LAST_DEAL_QUERY.md 2>/dev/null || true
          git add memory/WATCHLIST.md 2>/dev/null || true
          git add memory/USER_PREFERENCES.md 2>/dev/null || true
          git add memory/DEALS_FOUND.md 2>/dev/null || true
          git add memory/PRICE_HISTORY.md 2>/dev/null || true
          git add memory/TELEGRAM_SESSION.md 2>/dev/null || true
          git add memory/DEAL_TEST_LOG.md 2>/dev/null || true
          git commit -m "Auto: Telegram-Verarbeitung aktualisiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
