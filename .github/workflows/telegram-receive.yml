name: Telegram Receive Approval

on:
  schedule:
    - cron: "*/5 6-21 * * *" # zentraler Telegram-Poller
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Eigene Concurrency-Gruppe: Der Telegram-Poller ist ein unabhängiger
# Eingangskanal und darf nicht von Publisher-Schreibern verdrängt werden.
# cancel-in-progress: false, damit ein laufender Poller nie abgebrochen wird.
concurrency:
  group: telegram-receive
  cancel-in-progress: false
jobs:
  receive-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
         run: pip install requests Pillow

      - name: Route Telegram command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u telegram_router.py

      - name: Commit Telegram results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Alle Änderungen erfassen – State-Dateien bleiben sonst unstaged
          # und blockieren den anschließenden "git pull --rebase".
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "Auto: Telegram-Verarbeitung aktualisiert"
          fi

          git pull --rebase origin main
          git push
