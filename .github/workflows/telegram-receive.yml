name: Telegram Receive Approval

on:
  schedule:
    - cron: "2-57/5 * * * *" # gleiche Frequenz, außerhalb der vollen Stunde
  workflow_run:
    workflows: ["Telegram Morning Approval", "MotoGP Content Agency", "Daily Telegram Digest"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: "Nur Telegram-Verbindung prüfen; keine Nachrichten lesen/verarbeiten/senden"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: write

# Eigene Concurrency-Gruppe: Der Telegram-Poller ist ein unabhängiger
# Eingangskanal und darf nicht von Publisher-Schreibern verdrängt werden.
# cancel-in-progress: false, damit ein laufender Poller nie abgebrochen wird.
concurrency:
  group: telegram-receive
  cancel-in-progress: false
jobs:
  receive-approval:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests Pillow beautifulsoup4 boto3

      - name: Telegram-Verbindung ohne Nachrichtenverarbeitung prüfen
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PYTHON'
          from telegram_bot import _request
          try:
              _request("getMe")
              info = _request("getWebhookInfo").get("result", {})
          except Exception:
              raise SystemExit("Telegram-Verbindungsprüfung fehlgeschlagen; Zugang oder API prüfen.") from None
          if info.get("url"):
              raise SystemExit("Telegram-Webhook aktiv; Polling-Konflikt. Keine automatische Änderung.")
          print("Telegram API erreichbar; Polling-Modus bestätigt. Keine Updates konsumiert oder Nachrichten gesendet.")
          PYTHON

      - name: Route Telegram command
        if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PRIVATE_ASR_INTERNAL_TOKEN: ${{ secrets.PRIVATE_ASR_INTERNAL_TOKEN }}
          PRIVATE_MEDIA_RUNTIME_URL: https://edirne22-private-asr.butupeli.workers.dev/private-video/jobs
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u telegram_router.py

      - name: Commit Telegram results
        if: github.event_name != 'workflow_dispatch' || !inputs.diagnose_only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Alle Änderungen erfassen – State-Dateien bleiben sonst unstaged
          # und blockieren den anschließenden "git pull --rebase".
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "Auto: Telegram-Verarbeitung aktualisiert"
          fi

          git pull --rebase origin main
          git push
