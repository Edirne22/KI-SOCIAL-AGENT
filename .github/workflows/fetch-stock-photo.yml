name: Fetch Stock Photo for Pending Posts

on:
  schedule:
    - cron: "0 9 * * *"   # läuft täglich um 11:00 deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run stock photo fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python fetch_stock_photo.py

      - name: Commit photo and updated PUBLISHED.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md auto-image-*.jpg || true
          git commit -m "Auto: Bild für offenen Beitrag hinzugefügt" || echo "Keine Änderungen"
          git push
