name: Instagram Reply Adapter Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "instagram_engagement.py"
      - "instagram_reply_adapter.py"
      - "test_instagram_engagement.py"
      - ".github/workflows/instagram-reply-adapter-test.yml"

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run mocked Instagram reply unit tests
        run: python -m unittest test_instagram_engagement.py -v
