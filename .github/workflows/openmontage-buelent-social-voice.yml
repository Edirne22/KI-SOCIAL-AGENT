name: OpenMontage Buelent Social Voice
on:
  pull_request:
    paths:
      - "scripts/openmontage_social_copy.py"
      - "integrations/openmontage/research_memory_playbook.py"
      - "tests/test_openmontage_buelent_social_voice.py"
      - ".github/workflows/openmontage-buelent-social-voice.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_buelent_social_voice tests.test_openmontage_social_copy
