name: OpenMontage Daily 08 Berlin Readiness
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmontage-daily
  cancel-in-progress: false
jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.slot.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: slot
        run: python -m scripts.openmontage_daily_slot
  readiness:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::08:00 Europe/Berlin schedule reached."
          echo "::warning::Daily autonomous video production is NOT enabled until source verification, asset rights, MP4 rendering and private preview are integrated and proven."
