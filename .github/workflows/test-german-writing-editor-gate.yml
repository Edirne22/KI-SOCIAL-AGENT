name: TEST – German Racing Writing Gate

on:
  pull_request:
    paths:
      - 'chief_quality_manager.py'
      - 'tests/test_german_writing_editor_gate.py'
      - '.github/workflows/test-german-writing-editor-gate.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax and deterministic writing-gate regression
        run: |
          python -m py_compile chief_quality_manager.py tests/test_german_writing_editor_gate.py
          PYTHONPATH=. python tests/test_german_writing_editor_gate.py
