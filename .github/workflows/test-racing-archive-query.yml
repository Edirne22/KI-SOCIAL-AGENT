name: TEST – Telegram Racing Archive
on:
  pull_request:
    paths:
      - 'racing_archive_query.py'
      - 'racing_manual_selection.py'
      - 'telegram_router.py'
      - 'motogp_content_agency_v2.py'
      - 'tests/test_racing_archive_query.py'
      - '.github/workflows/test-racing-archive-query.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest requests
      - name: Syntax
        run: python -m py_compile racing_archive_query.py racing_manual_selection.py telegram_router.py motogp_content_agency_v2.py
      - name: Archive query regression
        run: pytest -q tests/test_racing_archive_query.py
