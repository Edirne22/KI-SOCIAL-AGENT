name: OpenMontage Undated Research Review
on:
  pull_request:
    paths:
      - "openmontage_fact_checker.py"
      - "tests/test_openmontage_undated_research_review.py"
      - ".github/workflows/openmontage-undated-review.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_undated_research_review
