name: Private ASR guarded Cloudflare deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-asr-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIVATE_ASR_INTERNAL_TOKEN: ${{ secrets.PRIVATE_ASR_INTERNAL_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      ASR_NO_EXTRA_COST_APPROVED: ${{ vars.ASR_NO_EXTRA_COST_APPROVED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require verified existing capacity and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$ASR_NO_EXTRA_COST_APPROVED" = "true" || { echo "BLOCKED: existing paid capacity/no-extra-cost not verified"; exit 1; }
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRIVATE_ASR_INTERNAL_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!name}" || { echo "BLOCKED: missing $name"; exit 1; }
          done
      - name: Build and typecheck isolated worker
        working-directory: infra/private-asr-cloudflare
        run: |
          npm install --no-audit --no-fund
          npx wrangler types
          npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --types @cloudflare/workers-types src/index.ts
      - name: Deploy isolated private ASR worker and container
        working-directory: infra/private-asr-cloudflare
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Install isolated ASR runtime secrets
        working-directory: infra/private-asr-cloudflare
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_ASR_INTERNAL_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --config wrangler.jsonc
          done
      - name: Authenticated health check
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/health"
          for n in $(seq 1 12); do
            code=$(curl -sS -o /tmp/asr-health -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" "$url" || true)
            if [ "$code" = 200 ] && grep -q '"ready":true' /tmp/asr-health; then echo "PRIVATE_ASR_LIVE_HEALTH_OK"; exit 0; fi
            sleep 10
          done
          echo "PRIVATE_ASR_LIVE_HEALTH_FAILED"; exit 1
