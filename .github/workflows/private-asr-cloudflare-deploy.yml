name: Private ASR guarded Cloudflare deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/private-asr/**"
      - "search_provider.py"
      - "infra/private-asr-cloudflare/**"
      - "scripts/private_birthday_first_production.py"
      - "scripts/private_video_recovery_dispatch.py"
      - "music_agent.py"
      - "content_factory_private_video_orchestrator.py"
      - "assets/musik/chill/hypnotic-ambient.mp3"
      - "config/MUSIC_LIBRARY.json"
      - ".github/workflows/private-asr-cloudflare-deploy.yml"
permissions:
  contents: read
concurrency:
  group: private-asr-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIVATE_ASR_INTERNAL_TOKEN: ${{ secrets.PRIVATE_ASR_INTERNAL_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRIVATE_MEDIA_RUNTIME_URL: https://edirne22-private-asr.butupeli.workers.dev/private-video/jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRIVATE_ASR_INTERNAL_TOKEN OPENROUTER_API_KEY GROQ_API_KEY GEMINI_API_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name}" || { echo "BLOCKED: missing $name"; exit 1; }
          done
      - name: Stage Docker build context for Wrangler
        shell: bash
        run: |
          set -euo pipefail
          target=infra/private-asr-cloudflare
          cp infra/private-asr/Dockerfile "$target/Dockerfile"
          cp content_factory_private_asr.py content_factory_private_asr_runtime.py content_factory_private_asr_r2_bridge.py "$target/"
          cp music_agent.py content_factory_private_video_orchestrator.py "$target/"
          mkdir -p "$target/scripts" "$target/assets/musik/chill" "$target/config"
          cp scripts/private_birthday_first_production.py scripts/ai_central_shared_inbox.py scripts/r2_media_warehouse.py "$target/scripts/"
          cp assets/musik/chill/hypnotic-ambient.mp3 "$target/assets/musik/chill/"
          cp config/MUSIC_LIBRARY.json "$target/config/"
          cp search_provider.py "$target/search_provider.py"
          cp infra/private-asr/research_gateway.py "$target/research_gateway.py"
          cp infra/private-asr/run_private_asr.py infra/private-asr/service.py infra/private-asr/verify_opencode_image.py "$target/"
          sed -i 's@COPY search_provider.py /app/search_provider.py@COPY search_provider.py /app/search_provider.py@; s@COPY infra/private-asr/research_gateway.py /app/research_gateway.py@COPY research_gateway.py /app/research_gateway.py@; s@COPY infra/private-asr/run_private_asr.py infra/private-asr/service.py infra/private-asr/verify_opencode_image.py /app/@COPY run_private_asr.py service.py verify_opencode_image.py /app/@' "$target/Dockerfile"
          mkdir -p "$target/infra/ai-central-tools/claude-only" "$target/infra/ai-central-tools/claude-code-readonly"
          cp infra/ai-central-tools/claude-only/opencode.jsonc "$target/infra/ai-central-tools/claude-only/opencode.jsonc"
          cp infra/ai-central-tools/claude-code-readonly/opencode.jsonc "$target/infra/ai-central-tools/claude-code-readonly/opencode.jsonc"
          test -s "$target/service.py"
          test -s "$target/content_factory_private_asr.py"
          python3 infra/private-asr/test_opencode_runtime_contract.py
      - name: Build and typecheck isolated worker
        working-directory: infra/private-asr-cloudflare
        run: |
          npm install --no-audit --no-fund
          npx wrangler types
          npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --types @cloudflare/workers-types src/index.ts
      - name: Verify three tools in release image before deployment
        shell: bash
        working-directory: infra/private-asr-cloudflare
        run: |
          set -euo pipefail
          docker build -t edirne22-media-tools:release .
          docker run --rm --entrypoint python edirne22-media-tools:release -c 'import faster_whisper, scenedetect; import subprocess; from music_agent import load_library; subprocess.run(["ffmpeg", "-version"], check=True, stdout=subprocess.DEVNULL); tracks=load_library(); assert tracks, "documented music library missing from release image"; print("WHISPER_FFMPEG_SCENEDETECT_MUSIC_OK")'
      - name: Deploy isolated private ASR worker and container
        working-directory: infra/private-asr-cloudflare
        run: npx wrangler deploy --containers-rollout=immediate --config wrangler.jsonc
      - name: Install isolated ASR runtime secrets
        working-directory: infra/private-asr-cloudflare
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_ASR_INTERNAL_TOKEN OPENROUTER_API_KEY GROQ_API_KEY GEMINI_API_KEY NVIDIA_API_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --config wrangler.jsonc
          done
      - name: Restart existing container once after deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/admin/container-restart"
          code=$(curl -sS -o /tmp/container-restart -w '%{http_code}' --max-time 30 \
            -X POST -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" "$url" || true)
          if [ "$code" != 202 ]; then
            echo "PRIVATE_ASR_DEPLOY_RESTART_FAILED: HTTP $code (body withheld)"
            exit 1
          fi
          python3 -c 'import json; d=json.load(open("/tmp/container-restart")); assert d.get("status") == "container_restart_requested"'
          echo "PRIVATE_ASR_DEPLOY_RESTART_REQUESTED"
      - name: Authenticated target-revision health check
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/health"
          expected_research="block9-groq-429-fallback-v1"
          expected_video="duenya-creative-chain-v3"
          for n in $(seq 1 30); do
            code=$(curl -sS -o /tmp/asr-health -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" "$url" || true)
            if [ "$code" = 200 ] && python3 - "$expected_research" "$expected_video" <<'PY' 2>/dev/null
          import json,sys
          d=json.load(open("/tmp/asr-health"))
          assert d.get("ready") is True
          assert d.get("research_runtime_revision") == sys.argv[1]
          assert d.get("private_video_runtime_revision") == sys.argv[2]
          PY
            then
              echo "PRIVATE_ASR_TARGET_REVISION_LIVE_OK"
              exit 0
            fi
            echo "ASR target revision attempt $n: HTTP $code (body withheld)"
            sleep 10
          done
          echo "PRIVATE_ASR_TARGET_REVISION_LIVE_FAILED"; exit 1
      - name: Wait for target OpenCode container contract
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/opencode/health"
          for n in $(seq 1 30); do
            code=$(curl -sS -o /tmp/opencode-health -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" "$url" || true)
            if [ "$code" = 200 ] && python3 -c 'import json; d=json.load(open("/tmp/opencode-health")); assert d.get("ready") is True; assert d.get("response_contract") == "text-v2"; assert d.get("code_ready") is True; assert d.get("code_executor") == "repo-readonly-v1"' 2>/dev/null; then
              echo "OPENCODE_TARGET_CONTRACT_LIVE_OK"
              exit 0
            fi
            echo "OpenCode target contract attempt $n: HTTP $code (body withheld)"
            sleep 10
          done
          echo "OPENCODE_TARGET_CONTRACT_LIVE_FAILED"
          exit 1
      - name: Authenticated live research smoke with source proof
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/research/search"
          payload='{"query":"What is the current date? Return current public web sources."}'
          code=$(curl -sS -o /tmp/research-live -w '%{http_code}' --max-time 90 -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" -H 'Content-Type: application/json' --data "$payload" "$url" || true)
          if [ "$code" != 200 ]; then
            echo "RESEARCH_LIVE_FAILED: HTTP $code (body withheld)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/research-live"))
          assert d.get("live_search") is True, "research_warning="+str(d.get("warning"))
          assert isinstance(d.get("provider"),str) and d["provider"]
          rows=d.get("results")
          assert isinstance(rows,list) and rows
          assert all(isinstance(x,dict) and str(x.get("url","")).startswith(("https://","http://")) for x in rows)
          print("RESEARCH_LIVE_SOURCE_PROOF_OK provider="+d["provider"])
          PY
      - name: Agent 21 runtime diagnostic on research failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          warning="unknown"
          provider="unknown"
          if test -s /tmp/research-live; then
            warning=$(python3 -c 'import json; d=json.load(open("/tmp/research-live")); print(str(d.get("warning") or "unknown")[:120])' 2>/dev/null || echo NON_JSON_OR_MISSING_RESEARCH_RESULT)
            provider=$(python3 -c 'import json; d=json.load(open("/tmp/research-live")); print(str(d.get("provider") or "unknown")[:80])' 2>/dev/null || echo unknown)
          fi
          python3 - "$warning" "$provider" <<'PY' | tee /tmp/agent21-runtime-diagnostic.json
          import json,sys,subprocess
          payload={"run_id":"${{ github.run_id }}","commit":"${{ github.sha }}","machine":"private-asr-container","route":"/research/search","provider":sys.argv[2],"state":"failure","error_class":sys.argv[1],"container_health":"passed","opencode_health":"passed"}
          p=subprocess.run(["python3","scripts/agent21_runtime_diagnostics.py"],input=json.dumps(payload),text=True,capture_output=True,check=True)
          print(p.stdout.strip())
          PY
          python3 -c 'import json; d=json.load(open("/tmp/agent21-runtime-diagnostic.json")); assert d["schema"]=="AGENT21-RUNTIME-DIAG-V1" and d["mode"]=="READ_ONLY" and d["secret_values_logged"] is False; print("AGENT21_RUNTIME_DIAGNOSTIC_READY error_class="+d["error_class"])'

      - name: Authenticated OpenCode CODE git-tool live smoke
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/opencode/code"
          payload='{"message":"Use the native shell tool to run exactly git rev-parse HEAD. After the tool result, reply exactly CODE_EXEC_OK followed by one space and that 40-character SHA."}'
          code=$(curl -sS -o /tmp/opencode-code-live -w '%{http_code}' --max-time 180 -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" -H 'Content-Type: application/json' --data "$payload" "$url" || true)
          if [ "$code" != 200 ]; then
            echo "OPENCODE_CODE_LIVE_FAILED: HTTP $code (body withheld)"
            exit 1
          fi
          python3 - <<'PY'
          import json,re
          d=json.load(open("/tmp/opencode-code-live"))
          text=str(d.get("text") or "").strip()
          tools=d.get("tools_used")
          assert d.get("workspace") == "repo-readonly-v1"
          assert isinstance(tools,list) and any(x in ("bash","shell") for x in tools), tools
          assert re.fullmatch(r"CODE_EXEC_OK [0-9a-f]{40}",text), text[:120]
          assert "<function_calls>" not in text and "<invoke name=" not in text
          print("OPENCODE_CODE_GIT_TOOL_LIVE_OK")
          PY
      - name: Authenticated OpenCode Claude live smoke
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/opencode/chat"
          payload='{"message":"Do not call tools. Reply with the single text OPENCODE_CLAUDE_OK."}'
          code=$(curl -sS -o /tmp/opencode-live -w '%{http_code}' --max-time 120 -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" -H 'Content-Type: application/json' --data "$payload" "$url" || true)
          if [ "$code" != 200 ]; then
            error_code=$(python3 -c 'import json; d=json.load(open("/tmp/opencode-live")); e=d.get("error","unknown_error"); print(e if isinstance(e,str) and len(e) <= 80 else "invalid_error")' 2>/dev/null || echo non_json_error)
            content_type=$(curl -sS -I --max-time 30 -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" "$url" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\\r",""); print $2; exit}' || true)
            body_bytes=$(wc -c < /tmp/opencode-live | tr -d ' ')
            echo "OPENCODE_CLAUDE_LIVE_FAILED: HTTP $code error=$error_code body_bytes=$body_bytes content_type=${content_type:-unknown} (response body withheld)"
            exit 1
          fi
          python3 -c 'import json; data=json.load(open("/tmp/opencode-live")); text=data.get("text","").strip(); assert text == "OPENCODE_CLAUDE_OK", repr(text[:120]); print("OPENCODE_CLAUDE_LIVE_OK")'
