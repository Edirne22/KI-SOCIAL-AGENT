name: OpenMontage Research Refresh Tests
on:
  pull_request:
    paths:
      - "scripts/openmontage_research_refresh.py"
      - "tests/test_openmontage_research_refresh.py"
      - ".github/workflows/openmontage-research-refresh.yml"
      - ".github/workflows/openmontage-research-refresh-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_research_refresh
