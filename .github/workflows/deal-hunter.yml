name: Deal Hunter

on:
  workflow_dispatch:
    inputs:
      product_query:
        description: "Produkt für die öffentliche Recherche"
        required: true
        type: string

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Search public deals with Gemini Grounding
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python deal_hunter.py "${{ inputs.product_query }}"
      - name: Commit deal research memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/DEALS_FOUND.md 2>/dev/null || true
          git add memory/SEARCH_PROVIDER_LOG.md 2>/dev/null || true
          git add memory/LAST_DEAL_QUERY.md 2>/dev/null || true
          git add memory/DEAL_TEST_LOG.md 2>/dev/null || true
          git commit -m "Auto: Deal-Recherche gespeichert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
