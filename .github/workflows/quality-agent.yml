name: Qualitäts-Agent
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Qualitätsprüfung
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quality_agent.py --notify
      - name: Qualitätsreport sichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/QUALITY_REPORT.md 2>/dev/null || true
          git add memory/QUALITY_HISTORY.md 2>/dev/null || true
          git commit -m "Auto: Qualitätsreport aktualisiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
