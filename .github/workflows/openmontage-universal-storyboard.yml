name: OpenMontage Universal Storyboard
on:
  pull_request:
    paths:
      - "openmontage_storyboard.py"
      - "tests/test_openmontage_universal_storyboard.py"
      - ".github/workflows/openmontage-universal-storyboard.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_universal_storyboard tests.test_openmontage_storyboard_memory
