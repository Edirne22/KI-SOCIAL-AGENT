name: MotoGP Pipeline Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: debug/motogp-pipeline-output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Offline deterministic audit tests
        run: |
          python -m py_compile motogp_pipeline_audit.py motogp_pipeline_audit_selftest.py motogp_pipeline_diagnose.py
          python motogp_pipeline_audit_selftest.py
      - name: Read-only pre-QM live diagnostic
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u motogp_pipeline_diagnose.py
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motogp-pipeline-diagnostic
          if-no-files-found: warn
          path: |
            artifacts/motogp-pipeline-audit.jsonl
            artifacts/motogp-stage-summary.json
            artifacts/motogp-rejections.jsonl
            artifacts/motogp-top10.json
