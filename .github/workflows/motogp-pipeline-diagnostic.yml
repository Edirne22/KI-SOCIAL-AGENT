name: MotoGP Pipeline Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Offline deterministic audit tests
        run: |
          python -m py_compile motogp_pipeline_audit.py motogp_pipeline_audit_selftest.py motogp_pipeline_diagnose.py motogp_date_recovery_selftest.py
          python -m py_compile racing_cfo.py racing_v855_hardening.py racing_cfo_selftest.py racing_semantic_qm.py motogp_quality_manager.py
          python racing_cfo_selftest.py
          python racing_pipeline_selftest.py
          python racing_v85_selftest.py
          python motogp_pipeline_audit_selftest.py
          python motogp_date_recovery_selftest.py
      - name: Read-only live diagnostic through Copy-QM
        env:
          PYTHONUNBUFFERED: '1'
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python -u motogp_pipeline_diagnose.py
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motogp-pipeline-diagnostic
          if-no-files-found: warn
          path: |
            artifacts/motogp-pipeline-audit.jsonl
            artifacts/motogp-stage-summary.json
            artifacts/motogp-rejections.jsonl
            artifacts/motogp-qm-results.json
            artifacts/motogp-top10.json
