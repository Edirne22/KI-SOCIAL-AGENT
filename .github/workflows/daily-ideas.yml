name: Generate Daily Content Idea

on:
  schedule:
        - cron: "0 6 * * *"  # läuft täglich um 08:00 deutscher Zeit (Sommer)
  workflow_dispatch:      # ermöglicht manuelles Starten per Klick

permissions:
  contents: write         # erlaubt dem Workflow, Änderungen zu committen und zu pushen

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run idea generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_ideas.py

      - name: Commit and push generated idea
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f content/IDEAS.md ]; then
            git add content/IDEAS.md
            git commit -m "Auto: neue Content-Idee generiert" || echo "Keine Änderungen"
            git push
          else
            echo "Keine Datei zum Committen vorhanden – überspringe Push."
          fi
