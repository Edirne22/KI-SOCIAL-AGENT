name: Generate Daily Content Idea

on:
  schedule:
        - cron: "0 6 * * *"  # läuft täglich um 08:00 deutscher Zeit (Sommer)
  workflow_dispatch:      # ermöglicht manuelles Starten per Klick

permissions:
  contents: write         # erlaubt dem Workflow, Änderungen zu committen und zu pushen

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run idea generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_ideas.py

      - name: Commit and push generated content plan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f content/CONTENT_PLAN.md ]; then
            git add content/CONTENT_PLAN.md memory/POST_HISTORY.md
            git commit -m "Auto: neuer Content-Plan generiert" || echo "Keine Änderungen"
            git pull --rebase origin main
          git push
          else
            echo "Keine Datei zum Committen vorhanden – überspringe Push."
          fi
