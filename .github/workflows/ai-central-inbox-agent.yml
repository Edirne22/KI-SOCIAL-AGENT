name: AI Central – reviewed free-tier inbox agent
on:
  workflow_dispatch:
    inputs:
      inbox_date:
        description: "Exact UTC date of reviewed R2 inbox task"
        required: true
        type: string
      team_mode:
        description: "Exact approved mode: free-only (legacy) or free-team (NVIDIA opt-in)"
        required: false
        type: choice
        options: [free-only, free-team]
        default: free-only
      inbox_id:
        description: "Exact user-approved text task ID"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-central-inbox-${{ inputs.inbox_id }}
  cancel-in-progress: false
jobs:
  reviewed-free-tier-advice:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AI_CENTRAL_FREE_TIER_VERIFIED: "true" # exact $0 openrouter/free route independently verified
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TEAM_MODE: ${{ inputs.team_mode }}
      AI_NVIDIA_DEVELOPER_FREE_VERIFIED: "true" # Only catalog-pinned, already manually live-proven NVIDIA endpoints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests boto3
      - name: Validate exact explicitly approved R2 text task BEFORE reporting start
        id: inbox_gate
        env:
          INBOX_DATE: ${{ inputs.inbox_date }}
          INBOX_ID: ${{ inputs.inbox_id }}
        run: python -m scripts.ai_central_reviewed_inbox_dispatch --date "$INBOX_DATE" --id "$INBOX_ID" --require-queued --mode "$TEAM_MODE"
      - name: Block all inference unless separate free-tier audit authorizes it
        run: |
          test "$AI_CENTRAL_FREE_TIER_VERIFIED" = "true" || { echo "FREE_TIER_NOT_VERIFIED: no API called"; exit 1; }
          if test "$TEAM_MODE" = "free-team"; then
            test "$AI_NVIDIA_DEVELOPER_FREE_VERIFIED" = "true" || { echo "NVIDIA free endpoints not verified"; exit 1; }
            test -n "$NVIDIA_API_KEY" || { echo "NVIDIA_API_KEY missing"; exit 1; }
          elif test "$TEAM_MODE" != "free-only"; then
            echo "Unknown mode"; exit 1
          fi
          test -n "$OPENROUTER_API_KEY" || { echo "OPENROUTER_API_KEY missing"; exit 1; }
      - name: Persist actual validated GitHub job start in private R2
        env:
          INBOX_ID: ${{ inputs.inbox_id }}
        run: python scripts/ai_central_task_lifecycle.py --id "$INBOX_ID" --state RUNNING
      - name: Run guarded explicitly approved free-only or NVIDIA team mode
        env:
          INBOX_ID: ${{ inputs.inbox_id }}
        run: |
          if test "$TEAM_MODE" = "free-team"; then
            python scripts/cloud_ai_central.py --task-file reviewed-central-task.json --inbox-task-id "$INBOX_ID" --free-team
          else
            python scripts/cloud_ai_central.py --task-file reviewed-central-task.json --inbox-task-id "$INBOX_ID" --free-only
          fi
      - name: Record final outcome only for a validated reviewed task
        if: always() && steps.inbox_gate.outcome == 'success'
        env:
          INBOX_ID: ${{ inputs.inbox_id }}
          PRIOR_RESULT: ${{ job.status }}
        run: |
          if test "$AI_CENTRAL_FREE_TIER_VERIFIED" != "true"; then
            state=BLOCKED_FREE_TIER
          elif test "$PRIOR_RESULT" = "success" && test -s ai-central-report.json; then
            state=PENDING_REVIEW
          else
            state=FAILED
          fi
          python -m pip install --disable-pip-version-check boto3 -q
          python scripts/ai_central_task_lifecycle.py --id "$INBOX_ID" --state "$state"
      - name: Private data never published as artifact from this public repository
        if: always()
        run: echo 'User tasks and full model outputs are stored only in private R2, never in GitHub artifacts.'
