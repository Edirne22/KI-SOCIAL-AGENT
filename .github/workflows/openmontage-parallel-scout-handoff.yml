name: OpenMontage Parallel Scout Handoff
on:
  pull_request:
    paths:
      - "integrations/openmontage/parallel_scout_handoff.py"
      - "tests/test_openmontage_parallel_scout_handoff.py"
      - ".github/workflows/openmontage-parallel-scout-handoff.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v tests.test_openmontage_parallel_scout_handoff
