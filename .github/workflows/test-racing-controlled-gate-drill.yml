name: TEST – Controlled Racing E2E Regression
on:
  pull_request:
    paths:
      - 'tests/test_racing_controlled_gate_drill.py'
      - '.github/workflows/test-racing-controlled-gate-drill.yml'
  workflow_dispatch:
jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests Pillow beautifulsoup4
      - run: python -m py_compile tests/test_racing_controlled_gate_drill.py racing_event_contract.py racing_source_claim_guard.py motogp_quality_manager.py racing_semantic_qm.py racing_final_guard.py chief_quality_manager.py racing_v855_hardening.py
      - run: PYTHONPATH=. python tests/test_racing_controlled_gate_drill.py
