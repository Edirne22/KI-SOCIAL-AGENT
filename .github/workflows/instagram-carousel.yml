name: Publish Instagram Carousel

on:
  schedule:
    - cron: "6,21,36,51 6-21 * * *" # alle 15 Minuten, versetzt ab 08:06 deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-plan-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Instagram-Karussell reservieren
        id: claim
        shell: bash
        run: |
          set +e
          python publication_claim.py --platform instagram-carousel --claim
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "has_claim=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 3 ]; then
            echo "has_claim=false" >> "$GITHUB_OUTPUT"
            echo "NO-WORK: Kein freigegebener, unreservierter instagram-carousel-Block vorhanden."
            exit 0
          fi
          echo "publication_claim.py fehlgeschlagen (exit $rc)." >&2
          exit "$rc"

      - name: Reservierung speichern
        if: steps.claim.outputs.has_claim == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung reserviert"
          git pull --rebase origin main
          git push

      - name: Reservierung starten
        if: steps.claim.outputs.has_claim == 'true'
        run: python publication_claim.py --platform instagram-carousel --start --token "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Startstatus speichern
        if: steps.claim.outputs.has_claim == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung gestartet"
          git pull --rebase origin main
          git push

      - if: steps.claim.outputs.has_claim == 'true'
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLICATION_CLAIM_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python instagram_carousel.py
      - name: Commit
        if: steps.claim.outputs.has_claim == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true 2>/dev/null || true
          git commit -m "Auto: Instagram-Karussell veröffentlicht" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
