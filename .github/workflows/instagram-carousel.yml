name: Publish Instagram Carousel

on:
  schedule:
    - cron: "20 10 * * *" # 12:20 deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-to-social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python instagram_carousel.py
      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md 2>/dev/null || true
          git commit -m "Auto: Instagram-Karussell veröffentlicht" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
