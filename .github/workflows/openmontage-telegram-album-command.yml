name: OpenMontage Telegram Album Command
on:
  pull_request:
    paths:
      - "scripts/openmontage_control.py"
      - "tests/test_openmontage_telegram_album_command.py"
      - ".github/workflows/openmontage-telegram-album-command.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_telegram_album_command tests.test_openmontage_editorial_approval_safety
