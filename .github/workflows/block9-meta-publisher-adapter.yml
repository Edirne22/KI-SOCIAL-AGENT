name: Block 9 canonical Meta video publisher guarded adapter
on:
  pull_request:
    paths:
      - 'content_factory_meta_video_ports.py'
      - 'tests/test_content_factory_meta_video_ports.py'
      - '.github/workflows/block9-meta-publisher-adapter.yml'
permissions:
  contents: read
jobs:
  meta-no-post-red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing Facebook/Source-Fact dependencies only
        run: python -m pip install --disable-pip-version-check requests
      - name: Syntax and canonical publisher safety regression
        run: |
          python -m py_compile content_factory_meta_video_ports.py content_factory_r2_job_repository.py content_factory_r2_publish_ledger.py
          python -m unittest -v tests.test_content_factory_meta_video_ports tests.test_content_factory_r2_publish_ledger tests.test_content_factory_publish_ledger tests.test_content_factory_golden_tablet tests.test_content_factory_r2_job_repository
      - name: Original factual content guard not weakened
        run: python tests/test_source_fact_contract_v1.py
