name: OpenMontage Render Readiness
on:
  pull_request:
    paths:
      - "integrations/openmontage/render_readiness.py"
      - "tests/test_openmontage_render_readiness.py"
      - ".github/workflows/openmontage-render-readiness.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_render_readiness
