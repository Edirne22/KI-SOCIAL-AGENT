name: Recover exact Dünya production after Agent 21 repair

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Private ASR guarded Cloudflare deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: recover-duenya-level12-after-agent21
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PRIVATE_ASR_INTERNAL_TOKEN: ${{ secrets.PRIVATE_ASR_INTERNAL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing R2 client dependencies
        run: python -m pip install --disable-pip-version-check requests boto3
      - name: Prove exact private-video runtime revision before recovery
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/health"
          expected="duenya-creative-chain-v3"
          code=$(curl -sS -o /tmp/private-video-health -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" "$url" || true)
          if [ "$code" != 200 ]; then
            echo "DUENYA_MEDIA_RUNTIME_NOT_READY: HTTP $code (body withheld)"
            exit 1
          fi
          python - "$expected" <<'PY'
          import json,sys
          d=json.load(open("/tmp/private-video-health"))
          assert d.get("ready") is True
          assert d.get("private_video_runtime_revision") == sys.argv[1]
          print("DUENYA_MEDIA_RUNTIME_REVISION_OK")
          PY
      - name: Agent 21 validate incident and reconcile orphaned RUNNING state
        id: agent21
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.agent21_duenya_stall_repair | tee /tmp/agent21-duenya.json
          action=$(python -c 'import json; print(json.load(open("/tmp/agent21-duenya.json"))["action"])')
          repair=$(python -c 'import json; print(json.load(open("/tmp/agent21-duenya.json"))["repair_id"])')
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "repair_id=$repair" >> "$GITHUB_OUTPUT"
          echo "AGENT21_DUENYA_DECISION=$action"
      - name: Agent 11 recovery-mode exact Dünya resume
        if: steps.agent21.outputs.action == 'HANDOFF_AGENT11'
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/private-video/jobs"
          payload='{"task_id":"f6f50c9f4c2690e4eb1fe978","production_revision":"v3"}'
          code=$(curl -sS -o /tmp/duenya-resume -w '%{http_code}' --max-time 45 \
            -X POST \
            -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" "$url" || true)
          if [ "$code" != 202 ]; then
            echo "DUENYA_AGENT11_RESUME_FAILED_HTTP_$code"
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open("/tmp/duenya-resume"))
          assert d.get("task_id")=="f6f50c9f4c2690e4eb1fe978"
          assert d.get("production_revision")=="v3"
          assert d.get("status")=="ACCEPTED"
          print("DUENYA_AGENT11_RECOVERY_RESUME_ACCEPTED")
          PY
      - name: Continue exact production through QM and private preview
        run: python -m scripts.watch_duenya_level12_production
