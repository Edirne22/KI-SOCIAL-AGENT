name: Recover exact Dünya production after Agent 21 repair

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Private ASR guarded Cloudflare deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: recover-duenya-level12-after-agent21
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PRIVATE_ASR_INTERNAL_TOKEN: ${{ secrets.PRIVATE_ASR_INTERNAL_TOKEN }}
      DUENYA_PRODUCTION_REVISION: v4-creative1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing R2 client dependencies
        run: python -m pip install --disable-pip-version-check requests boto3
      - name: Prove exact private-video runtime revision before recovery
        shell: bash
        run: |
          set -euo pipefail
          url="https://edirne22-private-asr.butupeli.workers.dev/health"
          expected="duenya-creative-chain-v3"
          code=$(curl -sS -o /tmp/private-video-health -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $PRIVATE_ASR_INTERNAL_TOKEN" "$url" || true)
          if [ "$code" != 200 ]; then
            echo "DUENYA_MEDIA_RUNTIME_NOT_READY: HTTP $code (body withheld)"
            exit 1
          fi
          python - "$expected" <<'PY'
          import json,sys
          d=json.load(open("/tmp/private-video-health"))
          assert d.get("ready") is True
          assert d.get("creative_runtime_revision") == "duenya-local-vision-v1"
          assert d.get("local_vision_ready") is True
          assert d.get("private_video_runtime_revision") == sys.argv[1]
          print("DUENYA_MEDIA_RUNTIME_REVISION_OK")
          PY
      - name: Start authorized creative revision only if absent
        run: |
          python - <<'PY'
          import os
          from scripts.ai_central_shared_inbox import client_from_env
          from scripts.start_duenya_level12_exact import _status, start_exact
          client,bucket=client_from_env()
          revision=os.environ["DUENYA_PRODUCTION_REVISION"]
          if _status(client,bucket,revision) is None:
              result=start_exact(client,bucket,os.environ["PRIVATE_ASR_INTERNAL_TOKEN"],production_revision=revision)
              print("DUENYA_CREATIVE_START="+str(result.get("result")))
          else:
              print("DUENYA_CREATIVE_EXISTING_REVISION")
          PY
      - name: Persist exact V4 watchdog incident before Agent 21
        id: watchdog
        shell: bash
        run: |
          python - <<'PY'
          import os
          from scripts.ai_central_shared_inbox import client_from_env
          from scripts.watch_duenya_level12_production import watch

          client, bucket = client_from_env()
          result = watch(
              client,
              bucket,
              production_revision=os.environ["DUENYA_PRODUCTION_REVISION"],
              max_checks=1,
              interval_seconds=0,
              stall_after_seconds=75,
          )
          action = "HANDOFF_AGENT21" if result["status"] in {"FAILED", "STALLED"} else result["status"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"action={action}\n")
          print("DUENYA_PRE_RECOVERY_WATCH_ACTION=" + action)
          PY
      - name: Agent 21 validate incident and reconcile orphaned RUNNING state
        if: steps.watchdog.outputs.action == 'HANDOFF_AGENT21'
        id: agent21
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.agent21_duenya_stall_repair | tee /tmp/agent21-duenya.json
          action=$(python -c 'import json; print(json.load(open("/tmp/agent21-duenya.json"))["action"])')
          repair=$(python -c 'import json; print(json.load(open("/tmp/agent21-duenya.json"))["repair_id"])')
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "repair_id=$repair" >> "$GITHUB_OUTPUT"
          echo "AGENT21_DUENYA_DECISION=$action"
      - name: Agent 11 recovery-mode exact Dünya resume
        if: steps.agent21.outputs.action == 'HANDOFF_AGENT11'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.agent11_private_video_recovery \
            --repair-id "${{ steps.agent21.outputs.repair_id }}" \
            --job-id "f6f50c9f4c2690e4eb1fe978" \
            --stage-id "video_editor_ffmpeg" \
            --checkpoint "video_editor_ffmpeg" \
            --production-revision "$DUENYA_PRODUCTION_REVISION"

      - name: Continue exact production through QM and private preview
        if: >-
          steps.watchdog.outputs.action == 'ACCEPTED' ||
          steps.watchdog.outputs.action == 'RUNNING' ||
          steps.agent21.outputs.action == 'NO_RECOVERY' ||
          steps.agent21.outputs.action == 'HANDOFF_AGENT11'
        run: python -m scripts.watch_duenya_level12_production
