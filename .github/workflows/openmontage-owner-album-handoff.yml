name: OpenMontage Owner Album Handoff
on:
  pull_request:
    paths:
      - "scripts/openmontage_owner_album_handoff.py"
      - "tests/test_openmontage_owner_album_handoff.py"
      - ".github/workflows/openmontage-owner-album-handoff.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v tests.test_openmontage_owner_album_handoff tests.test_openmontage_private_media_stage
