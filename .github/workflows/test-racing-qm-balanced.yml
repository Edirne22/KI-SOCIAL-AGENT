name: TEST – Racing QM Balanced Gates
on:
  pull_request:
    paths:
      - "racing_semantic_qm.py"
      - "racing_v855_hardening.py"
      - "tests/test_racing_qm_balanced.py"
      - ".github/workflows/test-racing-qm-balanced.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests Pillow beautifulsoup4
      - name: Syntax imports and balanced Racing QM regression
        run: |
          python -m py_compile racing_semantic_qm.py racing_v855_hardening.py tests/test_racing_qm_balanced.py
          PYTHONPATH=. python tests/test_racing_qm_balanced.py
          python racing_final_guard_selftest.py
          python tests/test_source_fact_contract_v1.py
          python racing_pipeline_selftest.py
          python racing_v85_selftest.py
