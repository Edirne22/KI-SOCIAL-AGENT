name: Hermes Agent Reach Runtime Smoke
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hermes-coordination-contract
    paths:
      - '.github/workflows/hermes-agent-reach-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit upstream installers (no unreviewed execution)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          urls = {
              "agent_reach": "https://raw.githubusercontent.com/Panniantong/Agent-Reach/main/README.md",
              "hermes": "https://raw.githubusercontent.com/NousResearch/hermes-agent/main/README.md",
          }
          for name, url in urls.items():
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      body = response.read(200000)
                  print(f"{name}: reachable; bytes={len(body)}")
              except Exception as exc:
                  raise SystemExit(f"{name}: upstream unavailable ({type(exc).__name__})")
          PY
      - name: Verify coordinator contracts
        run: python -m unittest -v tests.test_hermes_coordinator
