name: Hermes Agent Reach Runtime Smoke
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hermes-coordination-contract
    paths:
      - '.github/workflows/hermes-agent-reach-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit upstream installers (no unreviewed execution)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          urls = {
              "agent_reach": "https://raw.githubusercontent.com/Panniantong/Agent-Reach/main/README.md",
              "hermes": "https://raw.githubusercontent.com/NousResearch/hermes-agent/main/README.md",
          }
          for name, url in urls.items():
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      body = response.read(200000)
                  print(f"{name}: reachable; bytes={len(body)}")
              except Exception as exc:
                  raise SystemExit(f"{name}: upstream unavailable ({type(exc).__name__})")
          PY
      - name: Install upstream tools in isolated runner (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          git clone --depth 1 https://github.com/Panniantong/Agent-Reach.git /tmp/agent-reach
          echo "Hermes checkout: $(git -C /tmp/hermes-agent rev-parse --short HEAD)"
          echo "Agent Reach checkout: $(git -C /tmp/agent-reach rev-parse --short HEAD)"
          python -m venv /tmp/agent-reach-venv
          if test -f /tmp/agent-reach/pyproject.toml || test -f /tmp/agent-reach/setup.py; then
            /tmp/agent-reach-venv/bin/python -m pip install --disable-pip-version-check /tmp/agent-reach
          else
            echo "::warning::Agent Reach is not a pip-installable package at repository root"
          fi
          if test -f /tmp/hermes-agent/cli.py; then
            /tmp/agent-reach-venv/bin/python -m pip install --disable-pip-version-check -r /tmp/hermes-agent/requirements.txt
          /tmp/agent-reach-venv/bin/python /tmp/hermes-agent/cli.py --help > /tmp/hermes-cli-help.txt 2>&1
            sed -n '1,25p' /tmp/hermes-cli-help.txt
          else
            echo "::warning::Hermes cli.py not found at repository root; inspect upstream entrypoint"
          fi
          echo "Hermes files:"
          ls -la /tmp/hermes-agent | sed -n '1,35p'
          echo "Agent Reach files:"
          ls -la /tmp/agent-reach | sed -n '1,35p'
      - name: Execute isolated Toprak source discovery
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hermes_toprak_dryrun.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-toprak-research
          path: artifacts/hermes-toprak-research.json
          retention-days: 3
      - name: Verify coordinator contracts
        run: python -m unittest -v tests.test_hermes_coordinator
