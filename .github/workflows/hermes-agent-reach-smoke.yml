name: Hermes Agent Reach Runtime Smoke
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hermes-coordination-contract
    paths:
      - '.github/workflows/hermes-agent-reach-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hermes using official installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o /tmp/hermes-install.sh
          CI=1 bash /tmp/hermes-install.sh --non-interactive --skip-browser --skip-computer-use
          export PATH="$HOME/.local/bin:$PATH"
          command -v hermes
          hermes --help
          hermes doctor
      - name: Install Agent Reach using upstream instructions
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/agent-reach-venv
          /tmp/agent-reach-venv/bin/python -m pip install --disable-pip-version-check 'https://github.com/Panniantong/agent-reach/archive/main.zip'
          /tmp/agent-reach-venv/bin/agent-reach --help
          /tmp/agent-reach-venv/bin/agent-reach install --env=auto --safe
          /tmp/agent-reach-venv/bin/agent-reach doctor
      - name: Execute isolated Toprak source discovery
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hermes_toprak_dryrun.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-toprak-research
          path: artifacts/hermes-toprak-research.json
          retention-days: 3
      - name: Verify coordinator contracts
        run: python -m unittest -v tests.test_hermes_coordinator
