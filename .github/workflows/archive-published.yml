name: Rollierende Archivierung für PUBLISHED.md

on:
  schedule:
    # Täglich um 03:00 Uhr UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-published:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run rolling archiving script
        run: python archive_published.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Keine Änderungen zum Committen vorhanden."
          else
            git commit -m "chore(archive): rollierende Archivierung von PUBLISHED.md"
            git push
          fi
