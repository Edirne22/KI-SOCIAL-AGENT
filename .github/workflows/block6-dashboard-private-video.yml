name: Block 6 private Dashboard video preview regression
on:
  pull_request:
    paths:
      - "infra/ai-central-dashboard/**"
      - "content_factory_dashboard_preview.py"
      - "tests/test_content_factory_dashboard_preview.py"
      - "content_factory_golden_media.py"
      - ".github/workflows/block6-dashboard-private-video.yml"
  workflow_dispatch:
jobs:
  worker-and-factory-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install existing SOURCE-FACT test dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Check Python module syntax
        run: python -m py_compile content_factory_dashboard_preview.py content_factory_golden_media.py tests/test_content_factory_dashboard_preview.py
      - name: Actual private R2-byte/Golden-Tablet contract and attack tests
        run: python -m unittest -v tests.test_content_factory_dashboard_preview tests.test_content_factory_golden_media tests.test_content_factory_golden_tablet
      - name: Authenticated video streaming and existing dashboard regression
        working-directory: infra/ai-central-dashboard
        run: npm test
      - name: JS syntax
        working-directory: infra/ai-central-dashboard
        run: node --check src/index.js
      - name: SOURCE-FACT safety
        run: python tests/test_source_fact_contract_v1.py
