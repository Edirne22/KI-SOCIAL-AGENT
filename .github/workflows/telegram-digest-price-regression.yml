name: TEST – Telegram Digest Price Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "daily_digest.py"
      - "telegram_morning.py"
      - "telegram_receive.py"
      - "search_provider.py"
      - "price_tracking.py"
      - "test_telegram_bot_bugs.py"
      - ".github/workflows/telegram-digest-price-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependency
        run: python -m pip install requests beautifulsoup4
      - name: Run Telegram digest and price regression tests
        run: python -m unittest test_telegram_bot_bugs.py -v
