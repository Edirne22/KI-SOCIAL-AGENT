name: Existing coding provider presence
on:
  push:
    branches: [test/qwen-credential-probe]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Safe presence check
        shell: bash
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then echo 'OPENROUTER_PRESENT=true'; else echo 'OPENROUTER_PRESENT=false'; fi
          if [[ -n "$NVIDIA_API_KEY" ]]; then echo 'NVIDIA_PRESENT=true'; else echo 'NVIDIA_PRESENT=false'; fi
          if [[ -z "$OPENROUTER_API_KEY" && -z "$NVIDIA_API_KEY" ]]; then exit 1; fi
