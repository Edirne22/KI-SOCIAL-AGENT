name: Test Agnes Video Portrait

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Generate 9:16 Agnes test video
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python - <<'PY'
          from test_agnes import test_video
          if not test_video():
              raise SystemExit("Agnes-Video konnte nicht erzeugt werden.")
          PY
      - name: Test-Video als Artifact sichern
        uses: actions/upload-artifact@v4
        with:
          name: agnes-test-video-portrait
          path: assets/test/test-video-portrait.mp4
          if-no-files-found: error
