name: Block6 – single actual OpenChatCut edit render private R2 acceptance
on:
  pull_request:
    paths:
      - ".github/workflows/block6-one-shot-real-edit-render-r2.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/block6-one-shot-real-edit-render-r2.yml"
permissions:
  contents: read
concurrency:
  group: block6-single-actual-openchatcut-edit-render-r2
  cancel-in-progress: false
jobs:
  offline-acceptance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Source audit and JS syntax; no keys or live interaction in PR
        run: |
          node --check infra/openchatcut-cloudflare/live-acceptance.mjs
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('infra/openchatcut-cloudflare/live-acceptance.mjs','utf8');
          for(const needle of ['begin_edit_session','add_motion_graphic','review_edit_session','/export','ffprobe','PutObjectCommand','GetObjectCommand','DeleteObjectCommand','sha256']) assert(src.includes(needle),needle);
          console.log('REAL_OPENCHATCUT_EDIT_RENDER_R2_CONTRACT_PRESENT; LIVE_NOT_TESTED');
          JS
  full-real-acceptance-on-current-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-acceptance-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENCHATCUT_BASE_URL: https://edirne22-openchatcut-poc.butupeli.workers.dev
      OPENCHATCUT_MCP_TOKEN: ${{ secrets.OPENCHATCUT_MCP_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Check existing secret names before contacting production
        shell: bash
        run: |
          set -euo pipefail
          for n in OPENCHATCUT_MCP_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!n:-}" || { echo "BLOCK6_MISSING_SECRET_NAME=$n"; exit 1; }
          done
      - name: Install bounded existing test tools without deploying container
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          cd infra/openchatcut-cloudflare
          npm install --no-save @modelcontextprotocol/sdk @aws-sdk/client-s3
      - name: Exactly one real OpenChatCut MCP edit + export + ffprobe + private R2 proof
        shell: bash
        run: |
          set -uo pipefail
          stdout="$RUNNER_TEMP/block6-private-test-stdout"
          stderr="$RUNNER_TEMP/block6-private-test-stderr"
          trap 'rm -f "$stdout" "$stderr"' EXIT
          timeout 540s node infra/openchatcut-cloudflare/live-acceptance.mjs > "$stdout" 2> "$stderr"
          rc=$?
          export BLOCK6_TEST_RC="$rc"
          node - <<'JS'
          const fs=require('node:fs');
          const o=fs.readFileSync(process.env.RUNNER_TEMP+'/block6-private-test-stdout','utf8');
          const e=fs.readFileSync(process.env.RUNNER_TEMP+'/block6-private-test-stderr','utf8');
          const happened={
            health:o.includes('protected health:'),
            sdkConnected:o.includes('MCP_CONNECT_OK'),
            statusTool:o.includes('MCP openchatcut_status'),
            created:o.includes('MCP create_project'),
            target:o.includes('MCP target_project'),
            edit:o.includes('MCP begin_edit_session'),
            nativeRender:o.includes('HEADLESS_RENDER_PATH'),
            r2Pass:o.includes('"LIVE_ACCEPTANCE":"PASS"'),
            sessionLost:/session not found|session expired/i.test(e+o),
            upstreamDisconnect:o.includes('BEGIN_EDIT_SESSION_DISCONNECT')||e.includes('BEGIN_EDIT_SESSION_DISCONNECT'),
            timeout:Number(process.env.BLOCK6_TEST_RC)===124
          };
          const known=['StreamableHTTPError','TypeError','TimeoutError','AbortError','ECONNRESET','ECONNREFUSED','ETIMEDOUT','session not found','suddenly disconnected','native headless /export failed','ffprobe failed','SHA-256 mismatch','no resumable orphan','missing required','tool missing'];
          const types=known.filter(x=>(e+o).toLowerCase().includes(x.toLowerCase()));
          // Never log MCP session IDs, private project bodies, tokens, entire
          // upstream error strings or private R2 object data in this public repo.
          console.log('BLOCK6_SAFE_REAL_ACCEPTANCE',JSON.stringify({...happened,errorClasses:types.slice(0,5),exitCode:Number(process.env.BLOCK6_TEST_RC)}));
          if(!happened.r2Pass)process.exitCode=1;
          JS
          summary_rc=$?
          test "$rc" -eq 0 && test "$summary_rc" -eq 0
