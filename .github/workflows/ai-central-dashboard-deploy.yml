name: AI Central Dashboard – guarded Cloudflare deploy
# Deploy once on this workflow's reviewed merge; future UI updates stay manual.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-central-dashboard-deploy.yml'
      - '.github/workflows/block6-dashboard-first-real-video.yml'
      - 'infra/ai-central-dashboard/public/index.html'
      - 'infra/ai-central-dashboard/src/index.js'
      - 'infra/ai-central-dashboard/src/private-asr.js'
      - 'infra/ai-central-dashboard/wrangler.jsonc'
      - 'infra/ai-central-dashboard/tests/live-dashboard-e2e.mjs'
permissions:
  contents: read
jobs:
  deploy-private-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AI_DASHBOARD_TOKEN: ${{ secrets.AI_DASHBOARD_TOKEN }}
      PRIVATE_ASR_INTERNAL_TOKEN: ${{ secrets.PRIVATE_ASR_INTERNAL_TOKEN }}
      AI_GITHUB_DISPATCH_TOKEN: ${{ secrets.AI_GITHUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate prerequisites (no plaintext secrets)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account missing"; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "R2 bucket binding not configured"; exit 1; }
          test "${#AI_DASHBOARD_TOKEN}" -ge 24 || { echo "AI_DASHBOARD_TOKEN must be configured in GitHub Secrets (>=24 chars)"; exit 1; }
      - name: Offline Worker unit tests
        working-directory: infra/ai-central-dashboard
        run: npm test
      - name: Configure R2 binding (no credentials in configuration file)
        working-directory: infra/ai-central-dashboard
        run: |
          node -e 'const fs=require("fs");const f="wrangler.jsonc";const cfg=JSON.parse(fs.readFileSync(f));cfg.r2_buckets[0].bucket_name=process.env.R2_BUCKET_NAME;fs.writeFileSync(f,JSON.stringify(cfg,null,2));'
      - name: Deploy Worker static assets and private R2 binding
        working-directory: infra/ai-central-dashboard
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Install required secret (API stays 401 while absent)
        working-directory: infra/ai-central-dashboard
        run: printf '%s' "$AI_DASHBOARD_TOKEN" | npx --yes wrangler@4 secret put AI_DASHBOARD_TOKEN --config wrangler.jsonc
      - name: Install private ASR service credential
        working-directory: infra/ai-central-dashboard
        run: |
          test -n "$PRIVATE_ASR_INTERNAL_TOKEN" || { echo 'PRIVATE_ASR_INTERNAL_TOKEN missing'; exit 1; }
          printf '%s' "$PRIVATE_ASR_INTERNAL_TOKEN" | npx --yes wrangler@4 secret put PRIVATE_ASR_INTERNAL_TOKEN --config wrangler.jsonc
      - name: Install optional least-privileged dispatch credential
        if: env.AI_GITHUB_DISPATCH_TOKEN != ''
        working-directory: infra/ai-central-dashboard
        run: printf '%s' "$AI_GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GITHUB_DISPATCH_TOKEN --config wrangler.jsonc
      - name: Install browser harness for real dashboard E2E
        working-directory: infra/ai-central-dashboard
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real dashboard browser E2E - Claude and Groq research
        working-directory: infra/ai-central-dashboard
        env:
          DASHBOARD_URL: https://edirne22-ai-central-dashboard.butupeli.workers.dev
        run: node tests/live-dashboard-e2e.mjs
      - name: Completion note
        run: echo "Dashboard deployed and real browser E2E completed without logging secrets or model response bodies."
