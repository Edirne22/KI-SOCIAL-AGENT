name: OpenMontage Renew Private Link
on:
  workflow_dispatch:
    inputs:
      media_id:
        description: Existing OpenMontage R2 media UUID
        required: true
        type: string
permissions:
  contents: read
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R2 and Telegram dependencies
        run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Renew signed link without downloading or publishing
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENMONTAGE_MEDIA_ID: ${{ inputs.media_id }}
        run: python -m scripts.openmontage_renew_link
