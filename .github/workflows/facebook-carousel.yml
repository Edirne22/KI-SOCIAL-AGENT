name: Publish Facebook Carousel

on:
  schedule:
    - cron: "25 10 * * *" # 12:25 deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-plan-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Facebook-Karussell reservieren
        run: python publication_claim.py --platform facebook-carousel --claim

      - name: Reservierung speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung reserviert"
          git pull --rebase origin main
          git push

      - name: Reservierung starten
        run: python publication_claim.py --platform facebook-carousel --start --token "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Startstatus speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung gestartet"
          git pull --rebase origin main
          git push

      - env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PUBLICATION_CLAIM_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python facebook_carousel.py
      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true 2>/dev/null || true
          git commit -m "Auto: Facebook-Karussell veröffentlicht" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
