name: Qwen Code guarded coding assistant
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Approved coding task; never paste credentials or private media"
        required: true
        type: string
      account_free_confirmed:
        description: "Existing OpenRouter account is still on non-billed free tier"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  propose:
    if: inputs.account_free_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qwen Code
        run: npm install --no-audit --no-fund -g @qwen-code/qwen-code
      - name: Run bounded read-only coding analysis
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          export OPENAI_API_KEY="$OPENROUTER_API_KEY"
          export OPENAI_BASE_URL="https://openrouter.ai/api/v1"
          export OPENAI_MODEL="openrouter/free"
          mkdir -p ~/.qwen
          printf '%s\n' '{"security":{"auth":{"selectedType":"openai"}},"model":{"name":"openrouter/free"}}' > ~/.qwen/settings.json
          timeout 420 qwen --approval-mode plan --prompt "Read-only repository coding review. Do not edit files, run shell commands, access secrets, publish, deploy or open external URLs. Give a concise patch plan for this task: $TASK" > qwen-coding-review.txt 2>&1
          test -s qwen-coding-review.txt
          sed -i -E 's/sk-[A-Za-z0-9_-]+/[REDACTED]/g' qwen-coding-review.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-coding-review
          path: qwen-coding-review.txt
          retention-days: 2
