name: TEST – Racing Priority Repair + Turkish Five
on:
  pull_request:
    paths:
      - "motogp_content_agency_v2.py"
      - "racing_v855_hardening.py"
      - "motogp_telegram_receive_v85.py"
      - "turkish_editor_qm.py"
      - "telegram_router.py"
      - "tests/test_racing_priority_turkish_five.py"
      - ".github/workflows/test-racing-priority-turkish-five.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests Pillow beautifulsoup4
      - name: Syntax, imports and targeted regressions
        run: |
          python -m py_compile motogp_content_agency_v2.py racing_v855_hardening.py motogp_telegram_receive_v85.py turkish_editor_qm.py telegram_router.py tests/test_racing_priority_turkish_five.py
          PYTHONPATH=. python tests/test_racing_priority_turkish_five.py
          python racing_v85_selftest.py
          python racing_final_guard_selftest.py
          python tests/test_source_fact_contract_v1.py
