name: OpenMontage Caption Formatting
on:
  pull_request:
    paths:
      - "scripts/openmontage_social_copy.py"
      - "tests/test_openmontage_caption_formatting.py"
      - ".github/workflows/openmontage-caption-formatting.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_caption_formatting tests.test_openmontage_social_copy
