name: Test Content Factory Block 9
on:
 pull_request:
  paths: ["content_factory_control_center.py","content_factory_publish_ledger.py","tests/test_content_factory_control_center.py","tests/test_content_factory_publish_ledger.py",".github/workflows/test-content-factory-block9.yml"]
 workflow_dispatch:
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.11"}
   - run: python -m pip install --disable-pip-version-check requests
   - name: Syntax
     run: python -m py_compile content_factory_control_center.py content_factory_publish_ledger.py tests/test_content_factory_control_center.py tests/test_content_factory_publish_ledger.py
   - name: Blocks 1-2
     run: python -m unittest -v tests.test_content_factory_core tests.test_content_factory_persistence
   - name: Block 3
     run: python -m unittest -v tests.test_content_factory_discovery
   - name: Block 4
     run: python -m unittest -v tests.test_content_factory_newsroom
   - name: Block 5
     run: python -m unittest -v tests.test_content_factory_creative
   - name: Block 6
     run: python -m unittest -v tests.test_content_factory_media_production
   - name: Block 7
     run: python -m unittest -v tests.test_content_factory_av
   - name: Block 8
     run: python -m unittest -v tests.test_content_factory_golden_tablet
   - name: Block 9
     run: python -m unittest -v tests.test_content_factory_control_center tests.test_content_factory_publish_ledger
   - name: Existing publisher no-work safety
     run: |
       python -m pip install --disable-pip-version-check pytest
       pytest -q tests/test_publisher_no_work_workflows.py
   - name: SOURCE-FACT
     run: python tests/test_source_fact_contract_v1.py
