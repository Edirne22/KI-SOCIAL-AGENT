name: Test Content Factory Block 3 Discovery

on:
  pull_request:
    paths:
      - "content_factory_discovery.py"
      - "content_factory_adapters.py"
      - "tests/test_content_factory_discovery.py"
      - ".github/workflows/test-content-factory-block3.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Syntax and import check
        run: python -m py_compile content_factory_discovery.py content_factory_adapters.py tests/test_content_factory_discovery.py
      - name: Core and persistence regression checks
        run: python -m unittest -v tests.test_content_factory_core tests.test_content_factory_persistence
      - name: Block 3 discovery and scheduler checks
        run: python -m unittest -v tests.test_content_factory_discovery
