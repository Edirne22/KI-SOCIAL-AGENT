name: Guarded Development - Import Reviewed Source
on:
  pull_request:
    paths:
      - '.github/workflows/guarded-telegram-source-import.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: guarded-dev-source-import
  cancel-in-progress: false
jobs:
  reviewed-source-import:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Edirne22/KI-SOCIAL-AGENT'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import only reviewed Telegram intake source
        run: |
          set -euo pipefail
          git fetch origin main feat/telegram-review-feedback-and-warmup-contract
          git switch -C feature/guarded-telegram-album-import origin/main
          git show origin/feat/telegram-review-feedback-and-warmup-contract:scripts/telegram_private_media.py > scripts/telegram_private_media.py
          python -m py_compile scripts/telegram_private_media.py
          git add -N scripts/telegram_private_media.py
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            test "$changed" = scripts/telegram_private_media.py
          fi
          git add scripts/telegram_private_media.py
          if git diff --cached --quiet; then
            echo 'Reviewed source already imported; no new commit required.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: isolate existing private Telegram intake for guarded album development'
      - name: Push only isolated development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feature/guarded-telegram-album-import
      - name: Open draft PR for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view feature/guarded-telegram-album-import >/dev/null 2>&1; then
            echo 'Draft PR already exists.'
          elif ! gh pr create --draft --base main --head feature/guarded-telegram-album-import --title 'Block 9: isolated private Telegram intake baseline' --body 'Isolated existing source only. Not an album implementation. No automatic merge or deploy. Issue #369.'; then
            echo '::warning::GitHub Actions PR creation disabled. Branch pushed; PR must be opened using an authorized GitHub connector or enabled in repository Actions settings.'
            echo "PR link: https://github.com/${GITHUB_REPOSITORY}/compare/main...feature/guarded-telegram-album-import?expand=1"
          fi

  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate safe event separation and import contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/guarded-telegram-source-import.yml').read_text()
          required=("github.event_name == 'workflow_dispatch'", "github.event_name == 'pull_request'", "gh pr view feature/guarded-telegram-album-import", "git diff --name-only")
          for fragment in required:
              assert fragment in source, fragment
          print('PASS: PR validates workflow without performing write or deployment')
          PY
