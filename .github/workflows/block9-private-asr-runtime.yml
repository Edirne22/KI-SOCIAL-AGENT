name: Block 9 Private ASR Runtime Boundary
on:
  push:
    paths:
      - 'content_factory_private_asr*.py'
      - 'tests/test_content_factory_private_asr*.py'
      - '.github/workflows/block9-private-asr-runtime.yml'
  pull_request:
    paths:
      - 'content_factory_private_asr*.py'
      - 'tests/test_content_factory_private_asr*.py'
      - '.github/workflows/block9-private-asr-runtime.yml'
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile content_factory_private_asr.py content_factory_private_asr_runtime.py tests/test_content_factory_private_asr.py tests/test_content_factory_private_asr_runtime.py
      - run: python -m unittest discover -s tests -p 'test_content_factory_private_asr*.py' -v
