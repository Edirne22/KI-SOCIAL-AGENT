name: OpenMontage Planning Workflow Contract
on:
  pull_request:
    paths:
      - ".github/workflows/openmontage.yml"
      - "tests/test_openmontage_plan_workflow.py"
      - ".github/workflows/openmontage-planning-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v tests.test_openmontage_plan_workflow
