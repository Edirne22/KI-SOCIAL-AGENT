name: OpenChatCut POST-only diagnostic
on:
  push:
    branches: [diag/openchatcut-post-only-session-20261003]
    paths:
      - infra/openchatcut-cloudflare/post-only-diagnostic.mjs
      - .github/workflows/openchatcut-post-only-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENCHATCUT_BASE_URL: https://edirne22-openchatcut-poc.butupeli.workers.dev
      OPENCHATCUT_MCP_TOKEN: ${{ secrets.OPENCHATCUT_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only raw POST-only continuity probe
        run: node infra/openchatcut-cloudflare/post-only-diagnostic.mjs
