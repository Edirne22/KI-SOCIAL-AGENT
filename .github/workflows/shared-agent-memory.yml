name: Shared Agent Memory
on:
  pull_request:
    paths:
      - "integrations/agent_memory.py"
      - "tests/test_agent_memory.py"
      - ".github/workflows/shared-agent-memory.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_agent_memory
