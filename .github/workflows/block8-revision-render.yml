name: Block 8 bounded revision render and private R2 acceptance
on:
  pull_request:
    paths:
      - 'content_factory_revision_render.py'
      - 'scripts/block8_revision_smoke.py'
      - 'scripts/block8_apply_dashboard_review.py'
      - 'tests/test_content_factory_revision_render.py'
      - 'infra/ai-central-dashboard/**'
      - '.github/workflows/block8-revision-render.yml'
      - '.github/workflows/block8-dashboard-review-consumer.yml'
  push:
    branches: [main]
    paths:
      - 'content_factory_revision_render.py'
      - 'scripts/block8_revision_smoke.py'
      - '.github/workflows/block8-revision-render.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: block8-revision-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing FFmpeg and Python test dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check requests
      - name: Actual renderer integrity authority restart and canonical regression
        run: |
          python -m unittest -v tests.test_content_factory_revision_render tests.test_content_factory_revision_intake tests.test_content_factory_dashboard_review_applier tests.test_content_factory_dashboard_review_ack tests.test_content_factory_r2_job_repository tests.test_content_factory_dashboard_preview tests.test_content_factory_golden_tablet tests.test_ai_central_shared_inbox
          python tests/test_source_fact_contract_v1.py
      - name: Actual FFmpeg synthetic input through Python canonical records into Worker
        env:
          BLOCK8_SYNTHETIC_EVIDENCE: ${{ runner.temp }}/block8-synthetic-evidence.json
        run: |
          python -m scripts.block8_revision_smoke --evidence "$BLOCK8_SYNTHETIC_EVIDENCE"
          node --test infra/ai-central-dashboard/tests/*.test.mjs
  synthetic-private-r2:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: regression-redteam
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing FFmpeg and R2 SDK
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check boto3
      - name: New synthetic job only real private R2 bytes revision replay no social call
        run: python -m scripts.block8_revision_smoke --live-r2
