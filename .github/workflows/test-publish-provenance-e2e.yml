name: TEST – Publish Provenance E2E
on:
  pull_request:
    paths:
      - 'publish_provenance.py'
      - 'instagram_publish.py'
      - 'facebook_publish.py'
      - 'tests/test_publish_provenance_e2e.py'
      - '.github/workflows/test-publish-provenance-e2e.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests Pillow beautifulsoup4
      - run: python -m py_compile publish_provenance.py instagram_publish.py facebook_publish.py tests/test_publish_provenance_e2e.py
      - run: PYTHONPATH=. python tests/test_publish_provenance_e2e.py
