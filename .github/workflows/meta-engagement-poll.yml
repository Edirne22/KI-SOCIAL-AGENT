name: Meta Engagement Poll

on:
  schedule:
    - cron: "17 */3 * * *" # alle 3 Stunden, bewusst nicht zur vollen Stunde
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-engagement-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Poll Meta engagement
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u meta_engagement_poll.py

      - name: Persist engagement state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/INSTAGRAM_ENGAGEMENT_QUEUE.jsonl memory/INSTAGRAM_ENGAGEMENT_SEEN.txt memory/INSTAGRAM_COMMUNITY.md \
                  memory/FACEBOOK_ENGAGEMENT_QUEUE.jsonl memory/FACEBOOK_ENGAGEMENT_SEEN.txt memory/FACEBOOK_COMMUNITY.md \\
                  memory/META_ENGAGEMENT_POLL_INITIALIZED 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine neuen Engagement-Daten."
          else
            git commit -m "Auto: Engagement-Polling aktualisiert"
            git pull --rebase origin main
            git push
          fi
