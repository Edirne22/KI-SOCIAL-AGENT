name: Block 9 private ASR container install preflight (no deployment)
on:
  pull_request:
    paths:
      - "infra/private-asr/**"
      - "content_factory_private_asr*.py"
      - ".github/workflows/block9-private-asr-container-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no deployment, no secrets and no personal media
        run: |
          test -f infra/private-asr/Dockerfile
          ! grep -Ei 'secret|token|r2.*key' infra/private-asr/Dockerfile | grep -E 'ENV .*='
      - name: Build offline-capable private ASR image
        run: docker build -f infra/private-asr/Dockerfile -t edirne22-private-asr:preflight .
      - name: Verify imports as unprivileged runtime user
        run: docker run --rm --network none edirne22-private-asr:preflight
      - name: Python bridge regression and negative consent tests
        run: python -m unittest discover -s tests -p 'test_content_factory_private_asr*.py' -v
      - name: Truth boundary
        run: echo "IMAGE_IMPORT_ONLY; NOT deployed; no R2 access; no personal audio; model provisioning still required"
