name: Publish Approved Instagram Stories

on:
  schedule:
    - cron: "30 10 * * *"   # läuft täglich um 12:30 deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-to-social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Instagram Stories publisher
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python instagram_stories.py

      - name: Commit status update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git commit -m "Auto: Instagram-Story als veröffentlicht markiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
