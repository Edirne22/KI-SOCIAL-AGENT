name: Publish Approved Facebook Posts

on:
  schedule:
    - cron: "0 10 * * *"   # läuft täglich um 12:00 deutscher Zeit (Sommer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-plan-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Facebook-Beitrag reservieren
        run: python publication_claim.py --platform facebook --claim

      - name: Reservierung speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung reserviert"
          git pull --rebase origin main
          git push

      - name: Reservierung starten
        run: python publication_claim.py --platform facebook --start --token "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Startstatus speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung gestartet"
          git pull --rebase origin main
          git push

      - name: Run Facebook publisher
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PUBLICATION_CLAIM_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python facebook_publish.py

      - name: Commit status update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git commit -m "Auto: Beitrag als veröffentlicht markiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
