name: Publish Approved Facebook Posts

on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 6-21 * * *" # alle 5 Minuten, faellige Queue-Eintraege
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-plan-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Facebook-Beitrag reservieren
        id: claim
        shell: bash
        run: |
          set +e
          python publication_claim.py --platform facebook --claim
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "has_claim=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 3 ]; then
            echo "has_claim=false" >> "$GITHUB_OUTPUT"
            echo "NO-WORK: Kein freigegebener, unreservierter facebook-Block vorhanden."
            exit 0
          fi
          echo "publication_claim.py fehlgeschlagen (exit $rc)." >&2
          exit "$rc"

      - name: Reservierung speichern
        if: steps.claim.outputs.has_claim == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung reserviert"
          git pull --rebase origin main
          git push

      - name: Reservierung starten
        if: steps.claim.outputs.has_claim == 'true'
        run: python publication_claim.py --platform facebook --start --token "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Startstatus speichern
        if: steps.claim.outputs.has_claim == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung gestartet"
          git pull --rebase origin main
          git push

      - name: Run Facebook publisher
        if: steps.claim.outputs.has_claim == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PUBLICATION_CLAIM_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python facebook_publish.py

      - name: Commit status update
        if: steps.claim.outputs.has_claim == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          git commit -m "Auto: Beitrag als veröffentlicht markiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
