name: OpenMontage Album Preflight CLI
on:
  pull_request:
    paths:
      - "scripts/openmontage_album_preflight_cli.py"
      - "tests/test_openmontage_album_preflight_cli.py"
      - ".github/workflows/openmontage-album-preflight-cli.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install boto3 requests
      - run: python -m unittest -v tests.test_openmontage_album_preflight_cli
