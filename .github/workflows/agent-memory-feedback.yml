name: Agent Memory Feedback
on:
  pull_request:
    paths:
      - "integrations/agent_memory_feedback.py"
      - "tests/test_agent_memory_feedback.py"
      - ".github/workflows/agent-memory-feedback.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_agent_memory_feedback tests.test_agent_memory tests.test_agent_memory_preflight
