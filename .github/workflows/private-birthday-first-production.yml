name: Private birthday first production
# owner-authorized production trigger 2026-10-04
on:
  pull_request:
    paths:
      - "scripts/private_birthday_first_production.py"
      - ".github/workflows/private-birthday-first-production.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-birthday-first-production
  cancel-in-progress: false
jobs:
  syntax-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m py_compile scripts/private_birthday_first_production.py
      - run: grep -q 'No social publisher' scripts/private_birthday_first_production.py
  # Legacy GitHub rendering intentionally retired. Private video production is
  # dispatched only to the protected media container; this workflow remains
  # a syntax/safety gate and manual diagnostic entrypoint.
