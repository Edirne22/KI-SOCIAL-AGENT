name: Generate Weekly Content Plan

on:
  workflow_run:
    workflows: ["Update Race Calendar"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-plan
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Wochenplan-Regressionen prüfen
        run: |
          python -m py_compile weekly_plan.py tests/test_weekly_plan_community_contract.py
          PYTHONPATH=. python tests/test_weekly_plan_community_contract.py

      - name: Run weekly planner
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python weekly_plan.py

      - name: Commit and push weekly plan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f content/WOCHENPLAN.md ]; then
            git add content/WOCHENPLAN.md
            git commit -m "Auto: Wochenplan generiert" || echo "Keine Änderungen"
            git pull --rebase origin main
          git push
          else
            echo "Keine Datei zum Committen vorhanden – überspringe Push."
          fi
