name: OpenMontage Publishing Boundary
on:
  pull_request:
    paths:
      - "tests/test_openmontage_publishing_boundary.py"
      - "scripts/openmontage_control.py"
      - ".github/workflows/openmontage-publishing-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_publishing_boundary tests.test_openmontage_editorial_approval_safety
