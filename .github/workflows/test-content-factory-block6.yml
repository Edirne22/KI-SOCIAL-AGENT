name: Test Content Factory Block 6
on:
  pull_request:
    paths: ["content_factory_media_production.py","tests/test_content_factory_media_production.py",".github/workflows/test-content-factory-block6.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check requests
      - name: Syntax and imports
        run: python -m py_compile content_factory_media_production.py tests/test_content_factory_media_production.py
      - name: Blocks 1-2
        run: python -m unittest -v tests.test_content_factory_core tests.test_content_factory_persistence
      - name: Block 3
        run: python -m unittest -v tests.test_content_factory_discovery
      - name: Block 4
        run: python -m unittest -v tests.test_content_factory_newsroom
      - name: Block 5
        run: python -m unittest -v tests.test_content_factory_creative
      - name: Block 6
        run: python -m unittest -v tests.test_content_factory_media_production
      - name: SOURCE-FACT-CONTRACT
        run: python tests/test_source_fact_contract_v1.py
