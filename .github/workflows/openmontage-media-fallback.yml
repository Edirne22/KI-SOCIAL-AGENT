name: OpenMontage Media Fallback
on:
  pull_request:
    paths:
      - "openmontage_media_sourcing.py"
      - "tests/test_openmontage_media_fallback_rights.py"
      - ".github/workflows/openmontage-media-fallback.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_media_fallback_rights
