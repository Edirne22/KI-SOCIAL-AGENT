name: KI Central one-shot zero-price OpenRouter verification
on:
  push:
    branches: [feat/ai-central-e2e-controlled-runner]
    paths: [".github/workflows/ai-central-free-router-probe.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  zero-price-single-request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install requests
      - name: Invoke only documented zero-price openrouter/free, maximum 20 output tokens
        run: python scripts/ai_central_free_router_probe.py
