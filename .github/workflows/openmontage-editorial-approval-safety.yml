name: OpenMontage Editorial Approval Safety
on:
  pull_request:
    paths:
      - "scripts/openmontage_control.py"
      - "tests/test_openmontage_editorial_approval_safety.py"
      - ".github/workflows/openmontage-editorial-approval-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_editorial_approval_safety
