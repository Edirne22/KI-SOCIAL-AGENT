name: Publish Approved Instagram Reels

on:
  schedule:
    - cron: "0 10 * * *" # 12:00 Uhr deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Publish approved Instagram Reel
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python instagram_reels.py

      - name: Commit publication status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git commit -m "Auto: Instagram Reel als veröffentlicht markiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
