name: Publish Approved Instagram Reels

on:
  schedule:
    - cron: "2,17,32,47 6-21 * * *" # alle 15 Minuten, versetzt ab 08:02 deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-plan-writers
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktualisiere Arbeitsstand
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Bekannten fehlgeschlagenen Reel-Claim zurücksetzen
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("content/PUBLISHED.md")
          content = path.read_text(encoding="utf-8")
          old = "Publication-Claim: IN_BEARBEITUNG 34942345073-1"
          new = "Publication-Claim: BEREIT"
          if old in content:
              content = content.replace(old, new, 1)
              path.write_text(content, encoding="utf-8")
              print("Fehlgeschlagenen Reel-Claim kontrolliert auf BEREIT zurückgesetzt.")
          else:
              print("Kein zurückzusetzender Alt-Claim vorhanden.")
          PY

      - name: Instagram-Reel reservieren
        run: python publication_claim.py --platform reel --claim

      - name: Reservierung speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung reserviert"
          git pull --rebase origin main
          git push

      - name: Reservierung starten
        run: python publication_claim.py --platform reel --start --token "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Startstatus speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto: Veröffentlichung gestartet"
          git pull --rebase origin main
          git push

      - name: Publish approved Instagram Reel
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLICATION_CLAIM_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python instagram_reels.py

      - name: Commit publication status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/PUBLISHED.md
          git add memory/PUBLICATION_DUPLICATES.md 2>/dev/null || true
          git commit -m "Auto: Instagram Reel als veröffentlicht markiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
