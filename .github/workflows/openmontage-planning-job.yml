name: OpenMontage Planning Job
on:
  pull_request:
    paths:
      - "scripts/openmontage_plan_job.py"
      - "tests/test_openmontage_plan_job.py"
      - ".github/workflows/openmontage.yml"
      - ".github/workflows/openmontage-planning-job.yml"
permissions:
  contents: read
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_plan_job
