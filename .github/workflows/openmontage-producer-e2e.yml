name: OpenMontage Producer E2E
on:
  pull_request:
    paths:
      - 'scripts/openmontage_producer.py'
      - 'scripts/openmontage_creative_preview.py'
      - 'tests/test_openmontage_producer.py'
      - '.github/workflows/openmontage-producer-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on ephemeral GitHub runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Generate synthetic input locally (no external media or keys)
        run: |
          mkdir -p /tmp/om-e2e
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=blue:s=640x360:r=30" -t 2 -c:v libx264 -pix_fmt yuv420p /tmp/om-e2e/source.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/om-e2e/job.json').write_text(json.dumps({'clips':[{'path':'source.mp4','seconds':2}]}))
          PY
      - name: Render actual 1080x1920 MP4 and verify with ffprobe
        run: |
          python scripts/openmontage_producer.py /tmp/om-e2e/job.json /tmp/om-e2e/output.mp4
          test -s /tmp/om-e2e/output.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height -of json /tmp/om-e2e/output.mp4
      - name: Render animated three-scene creative preview
        run: |
          python scripts/openmontage_creative_preview.py /tmp/om-e2e/creative-preview.mp4
          test -s /tmp/om-e2e/creative-preview.mp4
      - name: Upload synthetic test video for review
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-producer-e2e
          path: |
            /tmp/om-e2e/output.mp4
            /tmp/om-e2e/creative-preview.mp4
          retention-days: 3
          if-no-files-found: error
