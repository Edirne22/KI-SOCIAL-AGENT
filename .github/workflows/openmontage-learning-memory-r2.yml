name: OpenMontage Learning Memory R2
on:
  pull_request:
    paths:
      - "integrations/openmontage/learning_memory_r2.py"
      - "tests/test_openmontage_learning_memory_r2.py"
      - ".github/workflows/openmontage-learning-memory-r2.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_learning_memory_r2
