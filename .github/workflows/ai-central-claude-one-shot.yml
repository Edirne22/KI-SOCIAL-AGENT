name: Claude Real Transport One-Shot Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude-low-token:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify script and model lock before inference
        run: |
          python -m pip install --disable-pip-version-check requests
          python -m py_compile scripts/ai_central_claude_probe.py tests/test_ai_central_claude_probe.py
          python -m unittest discover -s tests -p 'test_ai_central_claude_probe.py' -v
      - name: One exact Claude model request, max 24 output tokens, no retry
        run: python scripts/ai_central_claude_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-transport-check-${{ github.run_id }}
          path: claude-probe-result.json
          retention-days: 7
          if-no-files-found: ignore
