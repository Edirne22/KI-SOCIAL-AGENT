name: OpenMontage Telegram Caption Review
on:
  pull_request:
    paths:
      - "scripts/openmontage_telegram_preview.py"
      - "scripts/openmontage_publish_preview.py"
      - "tests/test_openmontage_telegram_caption_review.py"
      - ".github/workflows/openmontage-telegram-caption-review.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_telegram_caption_review
