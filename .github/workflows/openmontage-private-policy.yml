name: OpenMontage Private Approval Policy
on:
  pull_request:
    paths:
      - "scripts/openmontage_private_plan.py"
      - "tests/test_openmontage_autonomous_private_gates.py"
      - ".github/workflows/openmontage-private-policy.yml"
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_autonomous_private_gates
