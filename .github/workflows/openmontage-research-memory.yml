name: OpenMontage Research Memory
on:
  pull_request:
    paths:
      - "integrations/openmontage/research_memory_playbook.py"
      - "scripts/openmontage_private_plan.py"
      - "tests/test_openmontage_research_memory_playbook.py"
      - ".github/workflows/openmontage-research-memory.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_research_memory_playbook
