name: Migrate Assets – Phase 1

on:
  workflow_dispatch:
    inputs:
      apply_migration:
        description: "Echte Migration ausführen? (Vorschau bleibt deaktiviert)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: asset-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Inventar oder bestätigte Migration ausführen
        run: |
          if [ "${{ github.event.inputs.apply_migration }}" = "true" ]; then
            python migrate_assets.py --apply
          else
            python migrate_assets.py
          fi
      - name: Änderungen validieren und committen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Alles stagen; ignorierte migrierte Testdateien ausdrücklich einschließen.
          git add -A
          git add -f assets/test 2>/dev/null || true
          git status --short
          git commit -m "Maintenance: Asset-Struktur Phase 1 migriert" || echo "Keine Änderungen"
          # Ein Rebase-Fehler wird nicht ignoriert: Das schützt vor unbemerkt verlorenen Änderungen.
          git pull --rebase origin main
          git push || (echo "Push fehlgeschlagen, Retry in 5 Sek..." && sleep 5 && git pull --rebase origin main && git push)
