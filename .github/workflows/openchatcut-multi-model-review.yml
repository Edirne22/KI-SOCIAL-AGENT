name: OpenChatCut Multi-Model Advisory Review
on:
  pull_request:
    paths:
      - "scripts/openchatcut_multi_model_review.py"
      - "scripts/openchatcut_review_r2.py"
      - "tests/test_openchatcut_multi_model_review.py"
      - "tests/test_openchatcut_review_r2.py"
      - ".github/workflows/openchatcut-multi-model-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Offline tests (no keys or network)
        run: |
          python -m unittest discover -s tests -p 'test_openchatcut_multi_model_review.py' -v
          python -m unittest discover -s tests -p 'test_openchatcut_review_r2.py' -v
  advisory-live:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests boto3
      - name: Independent reviews and cross-check; no deploy
        run: python scripts/openchatcut_multi_model_review.py --output openchatcut-multi-review.json
      - name: Archive to R2 when credentials are configured
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -f openchatcut-multi-review.json ]; then
            python scripts/openchatcut_review_r2.py
          else
            echo "No report created, R2 archive skipped"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openchatcut-multi-model-review
          path: openchatcut-multi-review.json
          if-no-files-found: warn
          retention-days: 14
