name: OpenChatCut Multi-Model Advisory Review
on:
  push:
    branches: [diag/openchatcut-multi-model-review-bridge]
    paths:
      - "scripts/openchatcut_multi_model_review.py"
      - "tests/test_openchatcut_multi_model_review.py"
      - ".github/workflows/openchatcut-multi-model-review.yml"
  pull_request:
    paths:
      - "scripts/openchatcut_multi_model_review.py"
      - "tests/test_openchatcut_multi_model_review.py"
      - ".github/workflows/openchatcut-multi-model-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_openchatcut_multi_model_review.py' -v
  advisory-live:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/diag/openchatcut-multi-model-review-bridge')
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Run bounded advisory reviews (no deploy, no writes)
        run: python scripts/openchatcut_multi_model_review.py
