name: Analytics Report

on:
  schedule:
    - cron: "30 17 * * *" # 19:30 Uhr deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install requests
      - name: Create and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analytics_report.py
      - name: Commit saved report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/REPORTS/
          git commit -m "Auto: Tagesreport gespeichert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
