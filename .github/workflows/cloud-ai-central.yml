name: Cloud AI Central – guarded dispatch
on:
  pull_request:
    paths:
      - "scripts/cloud_ai_central.py"
      - "ai_central_ingress.py"
      - "ai_central_dashboard_view.py"
      - "telegram_router.py"
      - "tests/test_ai_central_ingress.py"
      - "tests/test_ai_central_dashboard_view.py"
      - "tests/test_cloud_ai_central.py"
      - "ai-central/**"
      - ".github/workflows/cloud-ai-central.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "Approved, repository-pinned engineering task"
        required: true
        type: choice
        options:
          - openchatcut-stability
permissions:
  contents: read
concurrency:
  group: ai-central-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Fail-closed central control plane tests
        run: |
          python -m unittest discover -s tests -p 'test_cloud_ai_central.py' -v
          python -m unittest discover -s tests -p 'test_ai_central_ingress.py' -v
          python -m unittest discover -s tests -p 'test_ai_central_dashboard_view.py' -v
          python -m py_compile telegram_router.py ai_central_ingress.py ai_central_dashboard_view.py
      - name: Validate allowlisted task
        run: python -c 'import json; from scripts.cloud_ai_central import validate_task; validate_task(json.load(open("ai-central/tasks/openchatcut-stability.json")))'
  live-advisory:
    needs: offline-contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests boto3
      - name: Run bounded parallel cloud reviewers and archive pending report in R2
        run: |
          case "${{ inputs.task }}" in
            openchatcut-stability) task=ai-central/tasks/openchatcut-stability.json ;;
            *) echo "Unsupported task" >&2; exit 1 ;;
          esac
          python scripts/cloud_ai_central.py --task-file "$task"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-central-pending-review-${{ github.run_id }}
          path: ai-central-report.json
          retention-days: 14
          if-no-files-found: warn
