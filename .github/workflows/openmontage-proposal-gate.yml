name: OpenMontage Proposal Gate
on:
  pull_request:
    paths:
      - "scripts/openmontage_private_plan.py"
      - ".github/workflows/openmontage-proposal-gate.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/openmontage_private_plan.py
      - run: python -m unittest discover -s tests -p "test_openmontage_private*.py" -v
