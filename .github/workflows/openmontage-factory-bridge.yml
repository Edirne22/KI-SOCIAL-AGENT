name: OpenMontage Factory Bridge Contract
on:
  pull_request:
    paths:
      - "integrations/openmontage/factory_bridge.py"
      - "tests/test_openmontage_factory_bridge.py"
      - ".github/workflows/openmontage-factory-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m py_compile integrations/openmontage/factory_bridge.py tests/test_openmontage_factory_bridge.py
      - name: Bridge and authorization regression
        run: python -m unittest -v tests.test_openmontage_factory_bridge tests.test_nervous_system_media_dispatch
