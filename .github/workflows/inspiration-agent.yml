name: Inspiration Agent
on:
  schedule:
    - cron: "0 5 * * 1,3,5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          CRAWLBASE_TOKEN: ${{ secrets.CRAWLBASE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m inspiration.orchestrator
      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/INSPIRATION_IDEAS.md 2>/dev/null || true
          git add memory/INSPIRATION_APIFY.md 2>/dev/null || true
          git add memory/INSPIRATION_BRIGHTDATA.md 2>/dev/null || true
          git add memory/BRIGHTDATA_DEBUG.md 2>/dev/null || true
          git add memory/INSPIRATION_CRAWLBASE.md 2>/dev/null || true
          git add memory/INSPIRATION_LOG.md 2>/dev/null || true
          git add memory/INSPIRATION_ARCHIVE/ 2>/dev/null || true
          git commit -m "Auto: Inspiration-Report aktualisiert" || echo "Keine Änderungen"
          git pull --rebase origin main
          git push
