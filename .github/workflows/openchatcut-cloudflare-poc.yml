name: OpenChatCut Cloudflare PoC

on:
  push:
    branches: [main]
    paths:
      - "infra/openchatcut-cloudflare/**"
      - ".github/workflows/openchatcut-cloudflare-poc.yml"
  pull_request:
    paths:
      - "infra/openchatcut-cloudflare/**"
      - ".github/workflows/openchatcut-cloudflare-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install wrapper dependencies
        working-directory: infra/openchatcut-cloudflare
        run: npm install
      - name: Validate Wrangler configuration
        working-directory: infra/openchatcut-cloudflare
        run: npx wrangler deploy --dry-run
      - name: Verify pinned upstream commit exists
        run: git -c protocol.version=2 fetch --no-tags --depth=1 https://github.com/0xsline/OpenChatCut.git d1af1ade45521e8ed9a5be09e3acad823f269453 && git cat-file -e d1af1ade45521e8ed9a5be09e3acad823f269453^{commit}

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENCHATCUT_MCP_TOKEN: ${{ secrets.OPENCHATCUT_MCP_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install wrapper dependencies
        working-directory: infra/openchatcut-cloudflare
        run: npm install
      - name: Guard required credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENCHATCUT_MCP_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!name:-}" || { echo "::error::Missing required GitHub Actions secret: $name"; exit 1; }
          done
      - name: Diagnose Cloudflare token and account access safely
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          probe() {
            local label="$1" url="$2" body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            echo "$label: HTTP $code"
            jq -r 'if .success == true then "success=true" else (.errors // [] | map("CF_ERROR code=\(.code) message=\(.message)") | .[]) end' "$body" 2>/dev/null || true
            rm -f "$body"
          }
          id_len="$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | wc -c | tr -d ' ')"
          echo "account_id_length: $id_len"
          if echo -n "$CLOUDFLARE_ACCOUNT_ID" | grep -qv '[^0-9a-fA-F]'; then
            echo "account_id_charset: hex"
          else
            echo "account_id_charset: invalid"
          fi
          probe "user_token_verify" "$api/user/tokens/verify"
          probe "account_token_verify" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          probe "accounts_list" "$api/accounts"
          probe "account_access" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID"
          probe "worker_script_access" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/edirne22-openchatcut-poc"
          echo "wrangler_whoami:"
          (cd infra/openchatcut-cloudflare && npx wrangler whoami) || true
      - name: Build private secret bundle outside repository
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg mcp "$OPENCHATCUT_MCP_TOKEN" \
            --arg account "$R2_ACCOUNT_ID" \
            --arg access "$R2_ACCESS_KEY_ID" \
            --arg secret "$R2_SECRET_ACCESS_KEY" \
            --arg bucket "$R2_BUCKET_NAME" \
            '{OPENCHATCUT_MCP_TOKEN:$mcp,R2_ACCOUNT_ID:$account,R2_ACCESS_KEY_ID:$access,R2_SECRET_ACCESS_KEY:$secret,R2_BUCKET_NAME:$bucket}' \
            > "$RUNNER_TEMP/openchatcut-secrets.json"
      - name: Deploy Worker, container and runtime secrets atomically
        working-directory: infra/openchatcut-cloudflare
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/openchatcut-secrets.json"
      - name: Remove temporary secret bundle
        if: always()
        run: rm -f "$RUNNER_TEMP/openchatcut-secrets.json"
      - name: Confirm deployed application exists
        working-directory: infra/openchatcut-cloudflare
        run: npx wrangler containers list


  live-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCHATCUT_BASE_URL: https://edirne22-openchatcut-poc.butupeli.workers.dev
      OPENCHATCUT_MCP_TOKEN: ${{ secrets.OPENCHATCUT_MCP_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install acceptance dependencies
        working-directory: infra/openchatcut-cloudflare
        run: npm install --no-save @modelcontextprotocol/sdk @aws-sdk/client-s3
      - name: Wait for protected production route
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPENCHATCUT_MCP_TOKEN" "$OPENCHATCUT_BASE_URL/_factory/health" || true)"
            [ "$code" = "200" ] && exit 0
            echo "route not ready yet: HTTP $code"
            sleep 10
          done
          exit 1
      - name: Real OpenChatCut render, ffprobe, private R2 roundtrip and negative controls
        working-directory: infra/openchatcut-cloudflare
        run: node live-acceptance.mjs
