name: OpenChatCut Cloudflare PoC

on:
  push:
    branches: [main]
    paths:
      - "infra/openchatcut-cloudflare/**"
      - ".github/workflows/openchatcut-cloudflare-poc.yml"
  pull_request:
    paths:
      - "infra/openchatcut-cloudflare/**"
      - ".github/workflows/openchatcut-cloudflare-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install wrapper dependencies
        working-directory: infra/openchatcut-cloudflare
        run: npm install
      - name: Validate Wrangler configuration
        working-directory: infra/openchatcut-cloudflare
        run: npx wrangler deploy --dry-run
      - name: Verify pinned upstream commit exists
        run: git ls-remote https://github.com/0xsline/OpenChatCut.git | grep -Fq "d1af1ade45521e8ed9a5be09e3acad823f269453"

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENCHATCUT_MCP_TOKEN: ${{ secrets.OPENCHATCUT_MCP_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install wrapper dependencies
        working-directory: infra/openchatcut-cloudflare
        run: npm install
      - name: Guard required credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENCHATCUT_MCP_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!name:-}" || { echo "::error::Missing required GitHub Actions secret: $name"; exit 1; }
          done
      - name: Build private secret bundle outside repository
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg mcp "$OPENCHATCUT_MCP_TOKEN" \
            --arg account "$R2_ACCOUNT_ID" \
            --arg access "$R2_ACCESS_KEY_ID" \
            --arg secret "$R2_SECRET_ACCESS_KEY" \
            --arg bucket "$R2_BUCKET_NAME" \
            '{OPENCHATCUT_MCP_TOKEN:$mcp,R2_ACCOUNT_ID:$account,R2_ACCESS_KEY_ID:$access,R2_SECRET_ACCESS_KEY:$secret,R2_BUCKET_NAME:$bucket}' \
            > "$RUNNER_TEMP/openchatcut-secrets.json"
      - name: Deploy Worker, container and runtime secrets atomically
        working-directory: infra/openchatcut-cloudflare
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/openchatcut-secrets.json"
      - name: Remove temporary secret bundle
        if: always()
        run: rm -f "$RUNNER_TEMP/openchatcut-secrets.json"
      - name: Confirm deployed application exists
        working-directory: infra/openchatcut-cloudflare
        run: npx wrangler containers list
