name: AI Central Model, OpenCode and Document Skills
on:
  pull_request:
    paths:
      - "scripts/ai_central_skill_router.py"
      - "scripts/ai_central_document_export.py"
      - "scripts/ai_central_inventory.py"
      - "scripts/ai_central_gemini_image.py"
      - "config/ai_central_capabilities.json"
      - "tests/test_ai_central_skills.py"
      - "tests/test_ai_central_gemini_image.py"
      - ".github/workflows/ai-central-model-skills.yml"
  workflow_dispatch:
    inputs:
      catalog_probe:
        description: "Read model lists with configured keys (no inference or billing actions)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install document skills
        run: python -m pip install --disable-pip-version-check python-docx reportlab XlsxWriter requests
      - name: Syntax and deterministic model-lock checks
        run: |
          python -m py_compile scripts/ai_central_skill_router.py scripts/ai_central_document_export.py scripts/ai_central_inventory.py scripts/ai_central_gemini_image.py
          python -m unittest discover -s tests -p 'test_ai_central_skills.py' -v
          python -m unittest discover -s tests -p 'test_ai_central_gemini_image.py' -v
      - name: Real PDF, DOCX and XLSX smoke exports
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from scripts.ai_central_document_export import export
          data={"title":"KI-Zentrale Format-Test","paragraphs":["Validierte Beispieldaten; keine KI-Ausführung."],
                "table":[["Bereich","Status"],["PDF","OK"],["DOCX","OK"],["XLSX","OK"]]}
          with tempfile.TemporaryDirectory() as d:
              for ext in ("pdf","docx","xlsx"):
                  item=export(data,Path(d)/("smoke."+ext))
                  assert item["bytes"]>500,item
                  print(ext,item["bytes"])
          PY
  opencode-cli-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install open-source OpenCode CLI on hosted ephemeral runner
        run: |
          npm install -g @opencode/cli
          command -v opencode
          opencode --version
      - name: No AI inference, no credentials, no repository writes
        run: echo "OpenCode installer smoke finished; model and coding permission deliberately not activated"
  ffmpeg-media-tools-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check standard Ubuntu FFmpeg tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=160x90:d=0.5 -c:v mpeg4 -pix_fmt yuv420p /tmp/ai-central-video.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:duration=0.5 /tmp/ai-central-audio.wav
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 /tmp/ai-central-video.mp4 | grep video
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 /tmp/ai-central-audio.wav | grep audio
          echo "FFmpeg video and audio paths actually execute"
  catalog-inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.catalog_probe
    needs: offline-skills
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check requests boto3
      - name: Read-only inventories and secret-presence audit; never print secret values
        run: python scripts/ai_central_inventory.py
      - name: Optional private R2 archive of bounded JSON report
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          if not all(os.getenv(n) for n in ("R2_ACCOUNT_ID","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","R2_BUCKET_NAME")):
              print("R2 skipped: optional credentials incomplete")
          else:
              import boto3
              s=boto3.client("s3",endpoint_url="https://"+os.environ["R2_ACCOUNT_ID"]+".r2.cloudflarestorage.com",
                  aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                  aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
              key="ai-central/v1/inventory/github-run-"+os.environ["GITHUB_RUN_ID"]+".json"
              s.put_object(Bucket=os.environ["R2_BUCKET_NAME"],Key=key,
                  Body=Path("ai-capability-inventory.json").read_bytes(),ContentType="application/json")
              print("Private R2 inventory archived:",key)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-central-model-audit-${{ github.run_id }}
          path: ai-capability-inventory.json
          if-no-files-found: warn
          retention-days: 14
