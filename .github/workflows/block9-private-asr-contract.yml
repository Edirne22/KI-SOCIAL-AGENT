name: Block 9 Private ASR Contract
on:
  push:
    paths:
      - 'content_factory_private_asr.py'
      - 'tests/test_content_factory_private_asr.py'
      - '.github/workflows/block9-private-asr-contract.yml'
  pull_request:
    paths:
      - 'content_factory_private_asr.py'
      - 'tests/test_content_factory_private_asr.py'
      - '.github/workflows/block9-private-asr-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile private ASR code and tests
        run: python -m py_compile content_factory_private_asr.py tests/test_content_factory_private_asr.py
      - name: Run synthetic metadata-only negative tests
        run: python -m unittest discover -s tests -p 'test_content_factory_private_asr.py' -v
