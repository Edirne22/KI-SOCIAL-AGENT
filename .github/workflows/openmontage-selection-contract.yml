name: OpenMontage Selection Contract
on:
  pull_request:
    paths:
      - "tests/test_openmontage_selection_writer_loader_contract.py"
      - ".github/workflows/openmontage-selection-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install boto3 requests
      - run: python -m unittest -v tests.test_openmontage_selection_writer_loader_contract
