name: Test Image Router
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run image_router smoke test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_IMAGE_API_STYLE: genai
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -c "
          from image_router import ImageRouter
          r = ImageRouter()
          img = r.generate_image('a red motorcycle on a race track')
          print('BYTES:', len(img))
          open('test_output.png','wb').write(img)
          print('OK')
          "
