name: OpenMontage Verified Render Entry
on:
  pull_request:
    paths:
      - "scripts/openmontage_render_verified.py"
      - "tests/test_openmontage_verified_render_entrypoint.py"
      - ".github/workflows/openmontage-verified-render.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for local media render tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install pytest requests
      - run: python -m unittest -v tests.test_openmontage_verified_render_entrypoint
