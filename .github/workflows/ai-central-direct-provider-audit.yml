name: AI Central – direct Gemini Groq candidate audit
on:
  pull_request:
    paths:
      - "scripts/ai_central_direct_provider_probe.py"
      - "tests/test_ai_central_direct_provider_probe.py"
      - ".github/workflows/ai-central-direct-provider-audit.yml"
  workflow_dispatch:
    inputs:
      provider:
        description: "Exactly one free-account candidate (no auto fallback)"
        type: choice
        options: [gemini, groq]
        required: true
      account_free_confirmed:
        description: "I separately confirmed this API key's account is on the actual FREE tier (no metered billing)"
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Syntax, denylist, single-request and malformed-response regression
        run: |
          python -m compileall -q scripts/ai_central_direct_provider_probe.py
          python -m unittest discover -s tests -p 'test_ai_central_direct_provider_probe.py'
  manual-single-provider-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.account_free_confirmed == true
    needs: offline-security
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_GEMINI_ACCOUNT_FREE_CONFIRMED: ${{ inputs.provider == 'gemini' && inputs.account_free_confirmed && 'true' || 'false' }}
      AI_GROQ_ACCOUNT_FREE_CONFIRMED: ${{ inputs.provider == 'groq' && inputs.account_free_confirmed && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests
      - name: One safe direct inference, no response payload in public logs
        env:
          CANDIDATE: ${{ inputs.provider }}
        run: python -m scripts.ai_central_direct_provider_probe --provider "$CANDIDATE"
