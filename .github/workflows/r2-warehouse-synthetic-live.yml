name: R2 warehouse synthetic private live smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/r2_media_warehouse.py'
      - 'scripts/r2_warehouse_live_smoke.py'
      - 'scripts/telegram_private_album_real_r2_smoke.py'
      - 'scripts/telegram_private_media.py'
      - '.github/workflows/r2-warehouse-synthetic-live.yml'
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and opt-in guard
        run: |
          python -m py_compile scripts/r2_media_warehouse.py scripts/r2_warehouse_live_smoke.py scripts/telegram_private_album_real_r2_smoke.py
          python - <<'PY'
          from scripts.r2_media_warehouse import lane_for_upload
          assert lane_for_upload() == 'private'
          assert lane_for_upload(explicit_social=True, contains_children=True) == 'private'
          print('OFFLINE_PRIVATE_GUARDS_PASS')
          PY
  live-synthetic-private:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WAREHOUSE_SYNTHETIC_LIVE_APPROVED: "true"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify existing private R2 binding
        shell: bash
        run: |
          set -euo pipefail
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!key:-}" || { echo "MISSING_R2_BINDING_$key"; exit 1; }
          done
      - name: Install minimal dependency
        run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Install and verify FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Synthetic photo video private R2 live roundtrip
        run: python -m scripts.r2_warehouse_live_smoke

  telegram-album-real-r2-synthetic-telegram:
    # Only an intentional manual dispatch on the exact PR branch can read
    # existing R2 secrets. No polling Telegram or touching personal media.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Edirne22/KI-SOCIAL-AGENT' && github.ref == 'refs/heads/feature/guarded-telegram-album-import' }}
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_ALBUM_REAL_R2_SYNTHETIC_APPROVED: "true"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require existing private R2 credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!key:-}" || { echo "MISSING_R2_BINDING_$key"; exit 1; }
          done
      - name: Install minimal R2 dependencies
        run: python -m pip install --disable-pip-version-check requests boto3
      - name: Check FFmpeg available
        run: ffmpeg -version | head -n 1
      - name: Real private R2 album upload with synthetic Telegram requests only
        run: python -m scripts.telegram_private_album_real_r2_smoke
