name: OpenMontage Telegram Learning
on:
  pull_request:
    paths:
      - "scripts/openmontage_control.py"
      - "tests/test_openmontage_telegram_learning.py"
      - ".github/workflows/openmontage-telegram-learning.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m unittest -v tests.test_openmontage_telegram_learning tests.test_openmontage_editorial_approval_safety
