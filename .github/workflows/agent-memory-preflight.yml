name: Agent Memory Preflight
on:
  pull_request:
    paths:
      - "integrations/agent_memory_preflight.py"
      - "tests/test_agent_memory_preflight.py"
      - ".github/workflows/agent-memory-preflight.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_agent_memory_preflight
