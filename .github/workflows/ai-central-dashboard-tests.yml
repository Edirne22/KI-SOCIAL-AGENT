name: AI Central Dashboard and Telegram Shared Inbox
on:
  pull_request:
    paths:
      - "infra/ai-central-dashboard/**"
      - "scripts/ai_central_shared_inbox.py"
      - "scripts/ai_central_natural_text.py"
      - "scripts/r2_media_warehouse.py"
      - "scripts/telegram_private_media.py"
      - "telegram_router.py"
      - "tests/test_ai_central_shared_inbox.py"
      - "tests/test_ai_central_natural_text.py"
      - "tests/test_r2_media_warehouse.py"
      - "tests/test_telegram_private_media.py"
      - ".github/workflows/telegram-receive.yml"
      - ".github/workflows/ai-central-dashboard-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-inbox-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.11"
      - name: Install minimal shared inbox HTTP dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Syntax and imports
        run: python -m py_compile telegram_router.py scripts/ai_central_shared_inbox.py tests/test_ai_central_shared_inbox.py scripts/r2_media_warehouse.py tests/test_r2_media_warehouse.py tests/test_ai_central_natural_text.py scripts/telegram_private_media.py tests/test_telegram_private_media.py
      - name: Telegram shared inbox unit tests
        run: python -m unittest discover -s tests -p 'test_ai_central_shared_inbox.py' -v
      - name: Natural Telegram request regression
        run: python -m unittest discover -s tests -p "test_ai_central_natural_text.py" -v
      - name: R2 warehouse private/social synthetic media tests
        run: python -m unittest discover -s tests -p "test_r2_media_warehouse.py" -v
      - name: Private Telegram photo video regression
        run: python -m unittest discover -s tests -p "test_telegram_private_media.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker security and inbox contract tests
        working-directory: infra/ai-central-dashboard
        run: npm test
      - name: Verify browser script parses
        working-directory: infra/ai-central-dashboard
        run: |
          node -e 'const fs=require("fs"),vm=require("vm");const html=fs.readFileSync("public/index.html","utf8");const script=html.split("<script>")[1]?.split("</script>")[0];if(!script)process.exit(1);new vm.Script(script);console.log("Browser script syntax OK")'
