name: OpenMontage Actions Render Wiring
on:
  pull_request:
    paths:
      - ".github/workflows/openmontage.yml"
      - "scripts/openmontage_load_verified_research.py"
      - "tests/test_openmontage_actions_render_wiring.py"
      - ".github/workflows/openmontage-actions-wiring.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_openmontage_actions_render_wiring
